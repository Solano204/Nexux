# ══════════════════════════════════════════════════════════════
# nexus-saga-orchestrator — DOCKER profile
# Active when: SPRING_PROFILES_ACTIVE=docker
# Set automatically by Dockerfile ENTRYPOINT: -Dspring.profiles.active=docker
#
# Purpose: Override all localhost addresses with Docker Compose
#          service names. This is the ONLY difference from dev.
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      uri: http://nexus-config-service:8888
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
    bus:
      enabled: true

  threads:
    virtual:
      enabled: true

  # ── PostgreSQL ─────────────────────────────────────────────
  # Saga state machine — requires ACID, tight lock_timeout
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_saga}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 5000
      pool-name: nexus-saga-docker-pool
      data-source-properties:
        lock_timeout: 5000
        application_name: nexus-saga-orchestrator

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: nexus-kafka:9092
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      isolation-level: read_committed
      auto-offset-reset: earliest
    listener:
      ack-mode: manual

  # ── Spring AI ──────────────────────────────────────────────
  # Used only for SagaFailureExplainerService structured output
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

server:
  port: 8095

# ── Eureka ─────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

# ── Observability ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        saga.duration.seconds: true
      percentiles:
        saga.duration.seconds: 0.5, 0.9, 0.95, 0.99
    tags:
      application: nexus-saga-orchestrator
      environment: docker
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    com.nexus.saga: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
