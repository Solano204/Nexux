server:
  port: 8095

spring:
  application:
    name: nexus-saga-orchestrator

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexus_saga}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:nexus_dev_password}
    hikari:
      maximum-pool-size: 40
      minimum-idle: 5
      connection-timeout: 5000
      data-source-properties:
        lock_timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: saga-orchestrator
      auto-offset-reset: earliest
      enable-auto-commit: false
    # NOTE: listener ack-mode is set in KafkaConfig.java (MANUAL)

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        saga.duration.seconds: true
      percentiles:
        saga.duration.seconds: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9412/api/v2/spans}

logging:
  level:
    com.nexus.saga: DEBUG          # tus logs de negocio — los únicos que quieres ver
    org.springframework.kafka: WARN
    org.apache.kafka.clients: WARN
    org.springframework.kafka.listener.KafkaMessageListenerContainer: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
    org.springframework.ai: WARN
