spring:
  application:
    name: nexus-saga-orchestrator

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: http://nexus-config-service:8888
      fail-fast: true

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_saga}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 40
      connection-timeout: 5000
      data-source-properties:
        lock_timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: >
        org.apache.kafka.common.serialization.StringSerializer
      value-serializer: >
        org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      isolation-level: read_committed
      auto-offset-reset: earliest
    listener:
      ack-mode: manual

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

server:
  port: 8095

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        saga.duration.seconds: true
      percentiles:
        saga.duration.seconds: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}