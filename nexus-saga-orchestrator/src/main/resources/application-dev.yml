# ══════════════════════════════════════════════════════════════
# nexus-saga-orchestrator — DEV profile
# Active when: SPRING_PROFILES_ACTIVE=dev
#
# Prerequisites:
#   docker compose up -d nexus-postgres nexus-kafka \
#     nexus-config-service nexus-discovery-service
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      enabled: false
      fail-fast: false

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_saga
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      data-source-properties:
        lock_timeout: 10000   # More lenient in dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      enable-auto-commit: false
      isolation-level: read_committed
      auto-offset-reset: earliest

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

server:
  port: 8095

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.nexus.saga: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org.springframework.kafka: DEBUG
