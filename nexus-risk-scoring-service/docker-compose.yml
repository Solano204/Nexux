# ══════════════════════════════════════════════════════════════════════
# nexus-risk-scoring-service — LOCAL DEVELOPMENT Docker Compose
# Profile: docker  (SPRING_PROFILES_ACTIVE=docker)
#
# Infrastructure:
#   PostgreSQL 16       (port 5432)  — risk profiles + computation jobs
#   Redis 7             (port 6379)  — cached risk scores (LB→fraud/AI)
#   Elasticsearch 8.13  (port 9200)  — transaction history queries
#   Kafka + Zookeeper   (port 9092)  — user.behavior.aggregated consumer
#                                      + risk.events producer
#   nexus-config-service  (port 8888)
#   nexus-discovery-service (port 8761)
#   Zipkin, Prometheus, Loki, Grafana
#   nexus-risk-scoring-service (port 8094)
#
# NO pgvector — plain postgres:16 (risk profiles use JSONB, not vectors)
#
# The nightly batch job (NightlyRiskScoringJobTriggerService) fires at
# 2:00 AM Mexico City via @Scheduled. Requires @EnableScheduling on
# Main.java (see BUGS.md BUG 1).
#
# COST WARNING: Uses gpt-4o (not gpt-4o-mini) at temperature 0.0.
#   Nightly batch scores all users — this is expensive.
#   Set OPENAI_API_KEY before starting.
#   Rate limiter: 55 calls/min (Resilience4j).
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-risk-data:
  elasticsearch-risk-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  nexus-postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus_risk
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-risk-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_risk"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nexus-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: nexus-risk-cluster
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-risk-data:/usr/share/elasticsearch/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.7
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  nexus-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    restart: unless-stopped
    depends_on:
      nexus-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://nexus-kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nexus-config-service:
    image: nexusplatform/nexus-config-service:latest
    container_name: nexus-config-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nexus-discovery-service:
    image: nexusplatform/nexus-discovery-service:latest
    container_name: nexus-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.22
    depends_on:
      nexus-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - nexus-network

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network

  nexus-promtail:
    image: grafana/promtail:2.9.3
    container_name: nexus-promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - nexus-network

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nexus-network

  nexus-risk-scoring-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-risk-scoring-service
    restart: unless-stopped
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_risk
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      REDIS_HOST: nexus-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      ELASTICSEARCH_URIS: http://nexus-elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      ENVIRONMENT: local-docker
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-elasticsearch:
        condition: service_healthy
      nexus-kafka:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.43
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8094/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
