# .github/workflows/nexus-risk-scoring-service.yml

name: Nexus Risk Scoring Service Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'nexus-risk-scoring-service/**'
      - '.github/workflows/nexus-risk-scoring-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'nexus-risk-scoring-service/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: nexus-risk-scoring-service
  JAVA_VERSION: '25'
  DOCKER_IMAGE: nexusplatform/nexus-risk-scoring-service

jobs:

  unit-tests:
    name: Compile + Unit Tests (Risk Scoring Plan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-risk-scoring-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn compile -q --no-transfer-progress

      - name: Run Unit Tests
        run: |
          mvn test \
            -Dgroups="unit" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            --no-transfer-progress
        env:
          OPENAI_API_KEY: "test-key-mock"

      - name: Cache compiled artifacts
        uses: actions/cache/save@v4
        with:
          path: nexus-risk-scoring-service/target
          key: compiled-risk-${{ github.sha }}

  integration-tests:
    name: Integration Tests (Risk Scoring Agent — Mocked AI)
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-risk-scoring-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Restore compiled artifacts
        uses: actions/cache/restore@v4
        with:
          path: nexus-risk-scoring-service/target
          key: compiled-risk-${{ github.sha }}

      - name: Run Integration Tests
        run: |
          mvn test \
            -Dgroups="integration" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            --no-transfer-progress
        env:
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
          OPENAI_API_KEY: "test-key-mock"

  docker-build:
    name: Docker Build + Push
    needs: [unit-tests, integration-tests]
    if: |
      always() && !failure() && !cancelled() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-risk-scoring-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: nexus-risk-scoring-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy nexus-risk-scoring-service to staging
        run: echo "Deploying ${{ env.SERVICE_NAME }}:${{ github.sha }} to staging"
