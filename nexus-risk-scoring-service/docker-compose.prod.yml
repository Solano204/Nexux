# ══════════════════════════════════════════════════════════════════════
# nexus-risk-scoring-service — PRODUCTION Docker Compose
#
# Infrastructure differences vs docker-compose.yml (dev):
#   • No build: — uses pre-built image from registry
#   • restart: always (not unless-stopped)
#   • No port exposure for Prometheus, Loki, Zipkin (internal only)
#   • Resource limits on every container
#   • json-file logging with rotation (not console stdout)
#   • POSTGRES_PASSWORD, REDIS_PASSWORD from env (no hardcoded dev values)
#   • Elasticsearch: xpack.security.enabled=true + ELASTICSEARCH_PASSWORD
#   • No Zookeeper/Kafka in this file — Kafka is platform-level in prod
#     (pass KAFKA_BOOTSTRAP_SERVERS pointing to your prod Kafka cluster)
#
# Required env vars (set in .env or CI/CD secrets — NEVER hardcode):
#   POSTGRES_PASSWORD          — PostgreSQL password
#   REDIS_PASSWORD             — Redis auth password
#   ELASTICSEARCH_PASSWORD     — Elasticsearch elastic user password
#   OPENAI_API_KEY             — Required: gpt-4o for risk scoring
#   GRAFANA_ADMIN_PASSWORD     — Grafana admin dashboard password
#   KAFKA_BOOTSTRAP_SERVERS    — Prod Kafka broker(s), e.g. kafka1:9092,kafka2:9092
#   DOCKER_HUB_USERNAME        — Docker Hub org (default: nexusplatform)
#   IMAGE_TAG                  — Image tag to deploy (default: latest)
#   TRACING_SAMPLE_RATE        — Zipkin sampling 0.0–1.0 (default: 0.1)
#
# COST WARNING:
#   This service uses gpt-4o (not gpt-4o-mini) at temperature 0.0.
#   The nightly batch job scores ALL active users — monitor token usage.
#   Resilience4j rate limiter caps at 55 calls/min per instance.
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-risk-data-prod:
  elasticsearch-risk-data-prod:
  redis-data-prod:
  prometheus-data-prod:
  grafana-data-prod:
  loki-data-prod:

# ── Shared logging config — applied to every container ────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:

  # ════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════════════

  nexus-postgres:
    image: postgres:16-alpine          # plain postgres — no pgvector needed
    container_name: nexus-postgres
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus_risk
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-risk-data-prod:/var/lib/postgresql/data
      # init.sql NOT mounted in prod — Flyway handles schema creation
    networks:
      nexus-network:
        ipv4_address: 172.20.0.5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_risk"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis-data-prod:/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      # Security ON in production
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"   # TLS terminated at load balancer
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.name: nexus-risk-cluster-prod
    volumes:
      - elasticsearch-risk-data-prod:/usr/share/elasticsearch/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.7
    logging: *default-logging
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
        reservations:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ════════════════════════════════════════════════════════════════════
  # PLATFORM SERVICES
  # ════════════════════════════════════════════════════════════════════

  nexus-config-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-config-service:${IMAGE_TAG:-latest}
    container_name: nexus-config-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nexus-discovery-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-discovery-service:${IMAGE_TAG:-latest}
    container_name: nexus-discovery-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.22
    logging: *default-logging
    depends_on:
      nexus-config-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ════════════════════════════════════════════════════════════════════
  # OBSERVABILITY
  # ════════════════════════════════════════════════════════════════════

  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: always
    environment:
      STORAGE_TYPE: mem
    # No port exposure — internal only in production
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: always
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-prod:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"    # 30 days in prod (7d in dev)
      - "--web.enable-lifecycle"
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: always
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data-prod:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  nexus-promtail:
    image: grafana/promtail:2.9.3
    container_name: nexus-promtail
    restart: always
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.1"

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-prod:/var/lib/grafana
    networks:
      - nexus-network
    logging: *default-logging
    depends_on:
      - nexus-prometheus
      - nexus-loki
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  # ════════════════════════════════════════════════════════════════════
  # nexus-risk-scoring-service
  # ════════════════════════════════════════════════════════════════════
  nexus-risk-scoring-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-risk-scoring-service:${IMAGE_TAG:-latest}
    container_name: nexus-risk-scoring-service
    restart: always
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # ── Database ─────────────────────────────────────────
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_risk
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # ── Redis ────────────────────────────────────────────
      REDIS_HOST: nexus-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # ── Elasticsearch ────────────────────────────────────
      ELASTICSEARCH_URIS: http://nexus-elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      # ── Kafka ────────────────────────────────────────────
      # In production, point to your external Kafka cluster
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexus-kafka:9092}
      # ── Discovery & Config ───────────────────────────────
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-nexus-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-nexus-config-password}
      # ── AI ───────────────────────────────────────────────
      # WARNING: gpt-4o — significantly more expensive than gpt-4o-mini
      # Nightly batch scores ALL users. Monitor usage at platform.openai.com
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # ── Observability ────────────────────────────────────
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      ENVIRONMENT: production
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-elasticsearch:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.43
    logging: *default-logging
    deploy:
      resources:
        limits:
          # gpt-4o + nightly batch over all users = memory-intensive
          memory: 2g
          cpus: "1.5"
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8094/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s    # 2min — batch job loads user data at startup
