# ══════════════════════════════════════════════════════════════════════
# nexus-audit-query-jvm — PRODUCTION Docker Compose
#
# Required env vars:
#   POSTGRES_PASSWORD, MONGODB_PASSWORD, ELASTICSEARCH_PASSWORD,
#   OPENAI_API_KEY, GRAFANA_ADMIN_PASSWORD
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-audit-data-prod:
  elasticsearch-audit-data-prod:
  mongodb-audit-data-prod:
  prometheus-data-prod:
  grafana-data-prod:
  loki-data-prod:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:

  nexus-postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus_audit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-audit-data-prod:/var/lib/postgresql/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_audit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nexus-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.name: nexus-audit-cluster-prod
    volumes:
      - elasticsearch-audit-data-prod:/usr/share/elasticsearch/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.7
    logging: *default-logging
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  nexus-mongodb:
    image: mongo:7.0
    container_name: nexus-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: nexus_audit
    volumes:
      - mongodb-audit-data-prod:/data/db
    networks:
      nexus-network:
        ipv4_address: 172.20.0.6
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nexus-config-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-config-service:${IMAGE_TAG:-latest}
    container_name: nexus-config-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nexus-discovery-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-discovery-service:${IMAGE_TAG:-latest}
    container_name: nexus-discovery-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    logging: *default-logging
    depends_on:
      nexus-config-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: always
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: always
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-prod:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - nexus-network
    logging: *default-logging

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: always
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data-prod:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network
    logging: *default-logging

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-prod:/var/lib/grafana
    networks:
      - nexus-network
    logging: *default-logging
    depends_on:
      - nexus-prometheus
      - nexus-loki

  nexus-audit-query-jvm:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-audit-query-jvm:${IMAGE_TAG:-latest}
    container_name: nexus-audit-query-jvm
    restart: always
    ports:
      - "8097:8097"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_audit
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ELASTICSEARCH_URIS: http://nexus-elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      MONGODB_URI: mongodb://nexus:${MONGODB_PASSWORD}@nexus-mongodb:27017/nexus_audit?authSource=admin
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      ENVIRONMENT: production
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-elasticsearch:
        condition: service_healthy
      nexus-mongodb:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.39
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8097/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
