# nexus-audit-query-jvm — DOCKER profile
spring:
  cloud:
    config:
      uri: http://nexus-config-service:8888
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
    bus:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_audit}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: nexus-audit-query-docker-pool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    elasticsearch:
      uris: http://nexus-elasticsearch:9200
    mongodb:
      uri: ${MONGODB_URI:mongodb://nexus:nexus_dev@nexus-mongodb:27017/nexus_audit?authSource=admin}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

server:
  port: 8097

eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    com.nexus.audit: INFO
    org.springframework.data.elasticsearch: WARN
    org.springframework.data.mongodb: WARN
