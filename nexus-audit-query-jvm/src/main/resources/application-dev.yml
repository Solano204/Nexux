spring:
  threads:
    virtual:
      # disabled: breaks Brave trace-context propagation - see application.yml
      enabled: false

  kafka:
    bootstrap-servers: localhost:19092

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_audit
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  elasticsearch:
    uris: http://localhost:9201

  data:
    mongodb:
      uri: mongodb://localhost:27018/nexus_audit

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

server:
  port: 8097

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9412/api/v2/spans

logging:
  level:
    com.nexus.saga: DEBUG          # tus logs de negocio — los únicos que quieres ver
    org.springframework.kafka: WARN
    org.apache.kafka.clients: WARN
    org.springframework.kafka.listener.KafkaMessageListenerContainer: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
    org.springframework.ai: WARN
