spring:
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://nexus-config-service:8888}
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
    bus:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_audit}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://nexus-elasticsearch:9200}
    mongodb:
      uri: ${MONGODB_URI:mongodb://nexus-mongodb:27017/nexus_audit}
      auto-index-creation: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
  instance:
    health-check-url-path: /actuator/health

management:
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.05}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    root: WARN
    com.nexus.audit: INFO
    org.springframework.ai: WARN
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
