# ══════════════════════════════════════════════════════════════════════
# nexus-audit-query-jvm — LOCAL DEVELOPMENT Docker Compose
# Profile: docker  (SPRING_PROFILES_ACTIVE=docker)
#
# Infrastructure (NO Kafka — pure read/query service):
#   PostgreSQL 16 + pgvector (port 5432)
#     └── nexus_audit DB     — pgvector audit event embeddings for RAG
#   Elasticsearch 8.13       (port 9200) — primary audit event index
#   MongoDB 7                (port 27017) — compliance report persistence
#   nexus-config-service     (port 8888)
#   nexus-discovery-service  (port 8761)
#   Zipkin, Prometheus, Loki, Grafana
#   nexus-audit-query-jvm    (port 8097)
#
# This service is a PURE CQRS READ SIDE:
#   - Never writes audit events (done by nexus-audit-write or Lambda)
#   - Compliance officers query in natural language
#   - Spring AI RAG pipeline:
#       1. Elasticsearch pre-filter on date/user/event type
#       2. Embed filtered events into session-scoped pgvector store
#       3. RAG advisor with multi-query expansion
#       4. gpt-4o-mini synthesises ComplianceQueryResult with citations
#       5. Report saved to MongoDB
#
# Key: pgvector/pgvector:pg16 required — audit event embeddings
#      are stored as vector(1536) columns for semantic search.
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-audit-data:
  elasticsearch-audit-data:
  mongodb-audit-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ────────────────────────────────────────────────────────────
  # POSTGRESQL + PGVECTOR — audit event embeddings for RAG
  # ────────────────────────────────────────────────────────────
  nexus-postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus_audit
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-audit-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_audit"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ────────────────────────────────────────────────────────────
  # ELASTICSEARCH — primary audit event index
  # This service READS the audit index written by nexus-audit-write
  # or the audit Lambda functions. No security in dev.
  # ────────────────────────────────────────────────────────────
  nexus-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: nexus-audit-cluster
      node.name: nexus-audit-es-01
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-audit-data:/usr/share/elasticsearch/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.7
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ────────────────────────────────────────────────────────────
  # MONGODB — compliance report storage
  # Collection: compliance_reports
  # Each ComplianceQueryResult is persisted here for audit trail
  # ────────────────────────────────────────────────────────────
  nexus-mongodb:
    image: mongo:7.0
    container_name: nexus-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: nexus_dev_password
      MONGO_INITDB_DATABASE: nexus_audit
    ports:
      - "27017:27017"
    volumes:
      - mongodb-audit-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.6
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ────────────────────────────────────────────────────────────
  # SPRING CLOUD INFRASTRUCTURE
  # ────────────────────────────────────────────────────────────
  nexus-config-service:
    image: nexusplatform/nexus-config-service:latest
    container_name: nexus-config-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nexus-discovery-service:
    image: nexusplatform/nexus-discovery-service:latest
    container_name: nexus-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    depends_on:
      nexus-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # OBSERVABILITY
  # ────────────────────────────────────────────────────────────
  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - nexus-network

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network

  nexus-promtail:
    image: grafana/promtail:2.9.3
    container_name: nexus-promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - nexus-network
    depends_on:
      - nexus-loki

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nexus-network
    depends_on:
      - nexus-prometheus
      - nexus-loki

  # ────────────────────────────────────────────────────────────
  # AUDIT QUERY SERVICE
  # ────────────────────────────────────────────────────────────
  nexus-audit-query-jvm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-audit-query-jvm
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # PostgreSQL (pgvector audit embeddings)
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_audit
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      # Elasticsearch (audit event index)
      ELASTICSEARCH_URIS: http://nexus-elasticsearch:9200
      # MongoDB (compliance reports)
      MONGODB_URI: mongodb://nexus:nexus_dev_password@nexus-mongodb:27017/nexus_audit?authSource=admin
      # Eureka
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      # Spring AI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Observability
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: "1.0"
      ENVIRONMENT: local-docker
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-elasticsearch:
        condition: service_healthy
      nexus-mongodb:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
      nexus-zipkin:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.39
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8097/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
