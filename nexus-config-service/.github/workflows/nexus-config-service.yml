# .github/workflows/nexus-config-service.yml

name: Nexus Config Service Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'nexus-config-service/**'
      - '.github/workflows/nexus-config-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'nexus-config-service/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: nexus-config-service
  JAVA_VERSION: '25'
  DOCKER_IMAGE: nexusplatform/nexus-config-service

jobs:

  # ════════════════════════════════════════════════════════════
  # STAGE 1: COMPILE + VALIDATE CONFIG FILES
  # Validates all YAML config files for correctness
  # ════════════════════════════════════════════════════════════
  validate:
    name: Compile + Validate Config YAMLs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-config-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn compile -q --no-transfer-progress

      - name: Validate all platform config YAMLs
        run: |
          # Install yq for YAML validation
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

          echo "Validating platform config YAML files..."
          FAILED=0
          for f in nexus-platform-config/*.yml; do
            if yq eval '.' "$f" > /dev/null 2>&1; then
              echo "  ✅ $f"
            else
              echo "  ❌ $f — INVALID YAML"
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "YAML validation failed"
            exit 1
          fi
          echo "All config files are valid YAML"

      - name: Run Tests
        run: mvn test --no-transfer-progress

      - name: Cache compiled artifacts
        uses: actions/cache/save@v4
        with:
          path: nexus-config-service/target
          key: compiled-config-${{ github.sha }}

  # ════════════════════════════════════════════════════════════
  # STAGE 2: DOCKER BUILD + PUSH
  # ════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build + Push
    needs: validate
    if: |
      always() && !failure() && !cancelled() &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-config-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: nexus-config-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════
  # STAGE 3: DEPLOY TO STAGING
  # Config service deploys first — before any other service
  # ════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy nexus-config-service to staging
        run: |
          echo "Deploying ${{ env.SERVICE_NAME }}:${{ github.sha }} to staging"
          echo "Config service MUST deploy before any other service."
