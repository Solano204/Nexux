# ══════════════════════════════════════════════════════════════════════
# nexus-config-service — LOCAL DEVELOPMENT Docker Compose
#
# The config service has a DIFFERENT topology from other services:
#   - It starts FIRST (all other services depend on it)
#   - It does NOT depend on nexus-discovery-service at startup
#     (hardcoded URL, not discovered — intentional to break bootstrap
#     chicken-and-egg problem)
#   - Its Git backend is a local bare repo created by init-config-repo.sh
#   - Spring Cloud Bus (Kafka) is optional — enables runtime refresh
#
# Infrastructure:
#   Kafka + Zookeeper  (optional — for Spring Cloud Bus refresh)
#   nexus-config-service  (port 8888)
#
# How the Git backend works:
#   1. An init container runs scripts/init-config-repo.sh
#   2. This creates a bare Git repo at /config-repo (Docker volume)
#   3. Copies all nexus-platform-config/*.yml into it
#   4. The config server serves from file:///config-repo
#
# In production: replace file:///config-repo with a real Git URL.
#
# Usage:
#   docker compose up -d
#   curl http://localhost:8888/nexus-api-gateway/docker
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  config-repo:          # The bare Git repository served by the config server
  kafka-data:
  zookeeper-data:

services:

  # ────────────────────────────────────────────────────────────
  # CONFIG REPO INIT
  # Runs once to create the bare Git repo from nexus-platform-config/
  # Uses busybox with git — no JVM needed for this step.
  # ────────────────────────────────────────────────────────────
  nexus-config-repo-init:
    image: alpine/git:latest
    container_name: nexus-config-repo-init
    volumes:
      - config-repo:/config-repo
      - ./nexus-platform-config:/config-source:ro
      - ./scripts/init-config-repo.sh:/init-config-repo.sh:ro
    entrypoint: ["/bin/sh", "/init-config-repo.sh"]
    networks:
      - nexus-network

  # ────────────────────────────────────────────────────────────
  # KAFKA — Spring Cloud Bus (optional for config refresh)
  # If you don't need runtime refresh, remove this + zookeeper.
  # POST /actuator/busrefresh → broadcasts refresh to ALL services.
  # ────────────────────────────────────────────────────────────
  nexus-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    restart: unless-stopped
    depends_on:
      nexus-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://nexus-kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # CONFIG SERVICE
  # ────────────────────────────────────────────────────────────
  nexus-config-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-config-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      # Basic auth protecting config endpoints
      CONFIG_SERVER_USERNAME: nexus-config
      CONFIG_SERVER_PASSWORD: nexus-config-password
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      ENVIRONMENT: local-docker
    volumes:
      - config-repo:/config-repo   # Shares the bare Git repo from init container
    depends_on:
      nexus-config-repo-init:
        condition: service_completed_successfully
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
