# application.yml — The config service's own configuration.
# This file lives IN the service, not in the Git config repo.
# It must bootstrap independently before connecting to Git.

server:
  port: 8888

spring:
  application:
    name: nexus-config-service

  # ════════════════════════════════════════════════════════
  # SPRING CLOUD CONFIG SERVER
  # Git backend: local bare repo mounted as Docker volume.
  # In production: replace uri with GitHub/GitLab private repo.
  # ════════════════════════════════════════════════════════
  cloud:
    config:
      server:
        git:
          uri: file:///config-repo
          default-label: main
          clone-on-start: true      # clone immediately, fail fast if unavailable
          force-pull: true          # always pull latest on config request
          refresh-rate: 30          # check for Git updates every 30s
          search-paths:
            - "."                   # config files at root of repo

    # ── Spring Cloud Bus via Kafka ──────────────────────────
    # POST /actuator/busrefresh → publishes RefreshEvent to
    # spring.cloud.bus Kafka topic → ALL services refresh.
    bus:
      enabled: true
      refresh:
        enabled: true
      destination: spring.cloud.bus

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}

  # ── Security: protect config endpoints ───────────────────
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

eureka:
  instance:
    hostname: nexus-config-service
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: false     # config server doesn't need the registry itself

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh,env,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.nexus: INFO
    org.springframework.cloud.config: INFO
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level
      service=nexus-config-service %logger{36} - %msg%n