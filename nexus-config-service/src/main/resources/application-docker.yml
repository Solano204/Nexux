# nexus-config-service — DOCKER profile
# Uses GitHub private repo as config backend.

spring:
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Solano204/nexus-platform-config.git
          default-label: main
          clone-on-start: true
          force-pull: true
          refresh-rate: 30
          search-paths:
            - "."
          username: ${GIT_USERNAME:Solano204}
          password: ${GIT_TOKEN}
    bus:
      enabled: true

  kafka:
    bootstrap-servers: nexus-kafka:9092

  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

eureka:
  instance:
    hostname: nexus-config-service
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: false

management:
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    root: INFO
    com.nexus: INFO
    org.springframework.cloud.config.server: INFO
