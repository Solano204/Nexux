server:
  port: 8090

spring:
  application:
    name: nexus-ai-assistant-service

  datasource:
    url: jdbc:postgresql://nexus-postgres:5432/nexus_ai_assistant
    username: nexus_app
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
          max-tokens: 2048
    ollama:
      base-url: http://nexus-ollama:11434
      chat:
        options:
          model: mistral:7b
          temperature: 0.7

nexus:
  ai:
    assistant:
      rate-limit:
        max-messages-per-day: 100
        max-tokens-per-hour: 100000

      memory:
        jdbc-max-messages: 10
        vector-top-k: 10

      agent:
        max-tool-call-steps: 8
        planning-model: gpt-4o
        execution-model: gpt-4o-mini

      rag:
        top-k: 20
        similarity-threshold: 0.65
        query-expansion-count: 4
        rerank-top-n: 6

      provider:
        primary: openai
        fallback: ollama
        fallback-on-circuit-open: true

      tools:
        account-balance-timeout-ms: 2000
        transaction-history-timeout-ms: 3000
        transfer-funds-timeout-ms: 10000

      multimodal:
        vision-model: gpt-4o-mini
        max-image-size-mb: 10

  safeguard:
    blocked-phrases:
      - "ignore previous instructions"
      - "ignore all instructions"
      - "system prompt"
      - "you are now"
      - "pretend you are"
      - "api_key"
      - "password"
      - "credit card number"
      - "ssn"
      - "social security"