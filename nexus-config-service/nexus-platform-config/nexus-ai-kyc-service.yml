server:
  port: 8091

spring:
  application:
    name: nexus-ai-kyc-service

  datasource:
    url: jdbc:postgresql://nexus-postgres:5432/nexus_kyc
    username: nexus_app
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20

  data:
    mongodb:
      uri: mongodb://nexus-mongodb:27017/nexus_kyc

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o             # vision — best accuracy for docs
          temperature: 0.0         # deterministic document extraction

nexus:
  kyc:
    pipeline:
      stage1-model: gpt-4o
      stage2-model: gpt-4o-mini
      stage1-temperature: 0.0
      stage2-temperature: 0.0
      confidence-threshold-approve: 0.80
      confidence-threshold-review: 0.60

    retry:
      max-attempts: 3
      attempt-window-days: 30

    document:
      max-size-mb: 10
      supported-formats: JPEG,PNG,WEBP
      s3-bucket: ${KYC_S3_BUCKET:nexus-kyc-documents}

    audit:
      retention-years: 7

resilience4j:
  retry:
    instances:
      kyc-vision-retry:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2