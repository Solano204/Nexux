# nexus-platform-config/application.yml
# Inherited by ALL services. Override in service-specific files.

# ════════════════════════════════════════════════════════════════
# VIRTUAL THREADS — Java 25 platform-wide setting
# ════════════════════════════════════════════════════════════════
spring:
  threads:
    virtual:
      enabled: true

  # ════════════════════════════════════════════════════════════
  # KAFKA — Shared producer/consumer defaults
  # Each service has its own consumer group in its config file
  # ════════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: nexus-kafka:9092
    producer:
      acks: all
      enable-idempotence: true
      retries: 2147483647
      max-in-flight-requests-per-connection: 1
      compression-type: snappy
      key-serializer: >
        org.apache.kafka.common.serialization.StringSerializer
      value-serializer: >
        org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      isolation-level: read_committed
      max-poll-records: 100
      auto-offset-reset: earliest
      key-deserializer: >
        org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: >
        org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

  # ════════════════════════════════════════════════════════════
  # JPA — Shared Hibernate defaults
  # ════════════════════════════════════════════════════════════
  jpa:
    hibernate:
      ddl-auto: validate            # NEVER auto-create in shared config
    properties:
      hibernate:
        default_schema: public
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        format_sql: false

  # ════════════════════════════════════════════════════════════
  # FLYWAY — Schema migration defaults
  # ════════════════════════════════════════════════════════════
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  # ════════════════════════════════════════════════════════════
  # MONGODB — Shared defaults
  # ════════════════════════════════════════════════════════════
  data:
    mongodb:
      auto-index-creation: false    # manage indexes explicitly

# ════════════════════════════════════════════════════════════════
# EUREKA — Discovery registration for all services
# ════════════════════════════════════════════════════════════════
eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    registry-fetch-interval-seconds: 30
    instance-info-replication-interval-seconds: 30
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ════════════════════════════════════════════════════════════════
# ACTUATOR — Shared observability endpoints
# ════════════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,refresh
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99

# ════════════════════════════════════════════════════════════════
# LOGGING — Structured JSON logging for all services
# ════════════════════════════════════════════════════════════════
logging:
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level
      traceId=%X{traceId} spanId=%X{spanId}
      %logger{36} - %msg%n
  level:
    root: INFO
    com.nexus: INFO
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
    org.apache.kafka: WARN

# ════════════════════════════════════════════════════════════════
# FEATURE FLAGS — Platform-wide toggles
# ════════════════════════════════════════════════════════════════
nexus:
  features:
    kyc-ai-analysis: true
    fraud-ai-analysis: true
    notification-ai-content: true
    analytics-ai-insights: true
    voice-input: true
    document-analysis: true

  # ── Kafka topic names — single source of truth ────────────
  # All services reference these. Changing a topic name here
  # changes it everywhere.
  kafka:
    topics:
      transactions-initiated: transactions.initiated
      transactions-completed: transactions.completed
      transactions-failed: transactions.failed
      fraud-flagged: fraud.flagged
      fraud-result: fraud.result
      accounts-created: accounts.created
      identity-verified: identity.verified
      identity-rejected: identity.rejected
      users-registered: users.registered
      kyc-review-required: kyc.review.required
      saga-commands: saga.commands
      saga-replies: saga.replies
      ledger-posted: ledger.posted
      analytics-aggregated: analytics.aggregated
      analytics-anomalies: analytics.anomalies.detected
      ai-query-logged: ai.query.logged
      notification-outbox: notification.outbox
      audit-events: audit.events