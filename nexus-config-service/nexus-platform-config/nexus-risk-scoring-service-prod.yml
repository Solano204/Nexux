spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:nexus-postgres}:5432/nexus_risk
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD}
  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:nexus-elasticsearch}:9200
  data:
    redis:
      host: ${REDIS_HOST:nexus-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 5s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
