# nexus-platform-config/application-dev.yml
# Overrides application.yml for ALL services when profile=dev
# ── LOCAL DEV OVERRIDES ───────────────────────────────────────
# Replaces all Docker hostnames with localhost
# Uses your actual local passwords

spring:
  # ── Kafka → localhost ─────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:19092

  # ── JPA dev settings ─────────────────────────────────────
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  # ── Redis → localhost ─────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

    # ── Elasticsearch → localhost ───────────────────────────
    elasticsearch:
      uris: http://localhost:9200

    # ── MongoDB → localhost ─────────────────────────────────
    mongodb:
      uri: mongodb://nexus:nexus_dev_password@localhost:27018/nexus_platform?authSource=admin

# ── Eureka → localhost ───────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ── Zipkin → localhost ───────────────────────────────────────
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,refresh

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.nexus: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
    org.springframework.cloud.config: DEBUG

nexus:
  features:
    kyc-ai-analysis: true
    fraud-ai-analysis: true
    notification-ai-content: true
    analytics-ai-insights: true

  fraud:
    thresholds:
      approve-below: 40
    velocity:
      max-transactions-5min: 100
      max-amount-5min: 100000

  transaction:
    rate-limit:
      max-per-user-per-minute: 200
    large-transaction-threshold: 50000

  ai:
    assistant:
      rate-limit:
        max-messages-per-day: 1000
        max-tokens-per-hour: 500000

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs
