server:
  port: 8096

spring:
  application:
    name: nexus-audit-service

  datasource:
    url: jdbc:postgresql://nexus-postgres:5432/nexus_audit
    username: nexus_app
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20

  data:
    elasticsearch:
      uris: http://nexus-elasticsearch:9200

nexus:
  audit:
    retention:
      default-years: 7
      financial-years: 10
      security-years: 7

    elasticsearch:
      index-prefix: nexus-audit
      rotation: monthly