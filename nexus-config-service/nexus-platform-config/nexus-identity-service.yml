server:
  port: 8083

spring:
  application:
    name: nexus-identity-service

  datasource:
    url: jdbc:postgresql://nexus-postgres:5432/nexus_identity
    username: nexus_app
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 30

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

nexus:
  identity:
    jwt:
      access-token-expiry-minutes: 60
      refresh-token-expiry-days: 30
      key-rotation-days: 90

    password:
      bcrypt-strength: 12           # ~300ms — financial platform standard
      min-length: 8
      max-length: 128
      require-uppercase: true
      require-digit: true

    kyc:
      max-attempts: 3
      attempt-window-days: 30
      s3-bucket: ${KYC_S3_BUCKET:nexus-kyc-documents}
      sqs-queue: ${KYC_SQS_QUEUE:nexus-kyc-pending}

    session:
      max-concurrent-sessions: 5
      session-timeout-minutes: 30
      suspicious-login-cooldown-minutes: 15

    mfa:
      totp-window-steps: 1
      sms-otp-expiry-minutes: 5
      max-otp-attempts: 3