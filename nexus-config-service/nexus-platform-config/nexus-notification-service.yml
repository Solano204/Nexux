server:
  port: 8089

spring:
  application:
    name: nexus-notification-service

  data:
    mongodb:
      uri: mongodb://nexus-mongodb:27017/nexus_notification

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
          max-tokens: 500

nexus:
  notification:
    rate-limit:
      max-per-user-per-hour: 10
      max-per-event-type-per-day: 3
      urgent-bypass: true

    quiet-hours:
      enabled: true
      start-hour: 22
      end-hour: 8
      timezone: America/Mexico_City
      except-urgent: true

    channels:
      push:
        enabled: true
        max-title-length: 65
        max-body-length: 255
      email:
        enabled: true
        from-address: ${EMAIL_FROM_ADDRESS:noreply@nexusbank.com}
        from-name: Nexus Bank
      sms:
        enabled: true
        max-length: 160
        prefix: "NEXUS: "
      in-app:
        enabled: true
        retention-days: 90
        security-retention-days: 365

    deduplication:
      window-seconds: 300

    aws:
      region: ${AWS_REGION:us-east-1}
      ses-configuration-set: nexus-transactional

resilience4j:
  retry:
    instances:
      openai-retry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2