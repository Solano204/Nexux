server:
  port: 8094

spring:
  application:
    name: nexus-risk-scoring-service

  datasource:
    url: jdbc:postgresql://nexus-postgres:5432/nexus_risk
    username: nexus_app
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 30

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1

nexus:
  risk:
    scoring:
      recalculation-cron: "0 0 3 * * *"    # 3am daily
      behavioral-update-ttl-hours: 24
      high-risk-threshold: 75
      medium-risk-threshold: 40

    agent:
      max-tool-call-steps: 8