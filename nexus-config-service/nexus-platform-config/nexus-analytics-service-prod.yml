spring:
  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:nexus-elasticsearch}:9200
  data:
    redis:
      host: ${REDIS_HOST:nexus-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 5s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
  kafka:
    streams:
      state-dir: /var/kafka-streams/analytics
