server:
  port: 8088

spring:
  application:
    name: nexus-ledger-service

  datasource:
    url: jdbc:postgresql://nexus-postgres:5432/nexus_ledger
    username: nexus_app
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 60
      connection-timeout: 5000
      data-source-properties:
        lock_timeout: 10000
        application_name: nexus-ledger-service

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  data:
    mongodb:
      uri: mongodb://nexus-mongodb:27017/nexus_ledger

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

nexus:
  ledger:
    reconciliation:
      nightly-cron: "0 0 1 * * *"
      snapshot-cron: "0 30 1 * * *"
      discrepancy-threshold: 0.0001

    interest:
      batch-cron: "0 0 2 1 * *"   # 2am 1st of every month

    rag:
      top-k: 12
      similarity-threshold: 0.60
      rerank-top-n: 5