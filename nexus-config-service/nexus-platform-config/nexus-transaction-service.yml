server:
  port: 8086

spring:
  application:
    name: nexus-transaction-service

  datasource:
    url: jdbc:postgresql://nexus-postgres:5432/nexus_transactions
    username: nexus_app
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 80         # highest pool — most write traffic
      statement-timeout: 10000
      lock-timeout: 5000

  kafka:
    streams:
      application-id: nexus-transaction-streams
      num-stream-threads: 4
      state-dir: /var/kafka-streams/transaction
      cache-max-bytes-buffering: 52428800
      commit-interval-ms: 1000
      processing-guarantee: at_least_once

  data:
    elasticsearch:
      uris: http://nexus-elasticsearch:9200

nexus:
  transaction:
    min-amount: 0.01
    max-single-amount: 500000
    currency: MXN

    rate-limit:
      max-per-user-per-minute: 20
      max-per-ip-per-minute: 50

    saga:
      balance-reserve-timeout-seconds: 30
      fraud-check-timeout-seconds: 60
      ledger-post-timeout-seconds: 30
      overall-timeout-hours: 24

    idempotency-window-seconds: 86400
    large-transaction-threshold: 10000
    expiry-hours: 24

resilience4j:
  circuitbreaker:
    instances:
      account-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 50
      fraud-service:
        failure-rate-threshold: 60
        slow-call-duration-threshold: 60s
        wait-duration-in-open-state: 60s
      ledger-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s