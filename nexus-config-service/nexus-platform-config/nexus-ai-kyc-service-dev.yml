# nexus-platform-config/nexus-identity-service-dev.yml
# Local dev overrides for identity service

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_kyc
    username: nexus
    password: nexus_dev_password

  # ── Kafka local con puerto de desarrollo ───────────────────
  kafka:
    bootstrap-servers: localhost:19092

  data:
    redis:
      host: localhost
      port: 6380
      password: ""

# ════════════════════════════════════════════════════════════════
# EUREKA CLIENTE: Override de máxima prioridad para Identity en Dev
# ════════════════════════════════════════════════════════════════
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      # 🔐 Al ponerlo aquí, NADA lo puede sobreescribir y los latidos funcionarán siempre
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true