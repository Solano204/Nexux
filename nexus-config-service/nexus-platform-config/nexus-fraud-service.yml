server:
  port: 8087

spring:
  application:
    name: nexus-fraud-service

  datasource:
    url: jdbc:postgresql://nexus-postgres:5432/nexus_fraud
    username: nexus_app
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 30
      lock-timeout: 5000

  data:
    mongodb:
      uri: mongodb://nexus-mongodb:27017/nexus_fraud

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1          # low randomness for consistent decisions
          max-tokens: 2000

nexus:
  fraud:
    thresholds:
      approve-below: 30
      review-above: 30
      review-below: 70
      reject-above: 70
      high-severity-above: 85

    prescreening:
      min-text-elements: 5
      min-text-length-chars: 100

    velocity:
      max-transactions-5min: 5
      max-amount-5min: 2000
      max-transactions-60min: 20
      max-amount-60min: 10000
      currency: MXN

    agent:
      max-tool-call-steps: 8
      planning-timeout-seconds: 30
      tool-execution-timeout-seconds: 10

    rag:
      top-k: 15
      similarity-threshold: 0.60
      rerank-top-n: 6
      query-expansion-count: 4

    rules-cache-refresh-seconds: 300

resilience4j:
  retry:
    instances:
      openai-fraud:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      openai-fraud:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 20