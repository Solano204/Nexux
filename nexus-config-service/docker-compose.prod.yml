# ══════════════════════════════════════════════════════════════════════
# nexus-config-service — PRODUCTION Docker Compose
#
# Production difference:
#   - Git backend: REPLACE file:///config-repo with a real GitHub/GitLab URL
#   - Set GIT_URI, GIT_USERNAME, GIT_PASSWORD (or SSH key) environment vars
#   - Strong CONFIG_SERVER_PASSWORD
#
# Required env vars:
#   CONFIG_SERVER_PASSWORD, GIT_URI (or leave file-based),
#   GIT_USERNAME, GIT_PASSWORD (if private repo)
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  config-repo-prod:
  loki-data-prod:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # In production, use a real Git repository instead of the init container.
  # Comment out nexus-config-repo-init and set GIT_URI in nexus-config-service.
  nexus-config-repo-init:
    image: alpine/git:latest
    container_name: nexus-config-repo-init
    volumes:
      - config-repo-prod:/config-repo
      - ./nexus-platform-config:/config-source:ro
      - ./scripts/init-config-repo.sh:/init-config-repo.sh:ro
    entrypoint: ["/bin/sh", "/init-config-repo.sh"]
    networks:
      - nexus-network

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: always
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data-prod:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network
    logging: *default-logging

  nexus-config-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-config-service:${IMAGE_TAG:-latest}
    container_name: nexus-config-service
    restart: always
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexus-kafka:9092}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://nexus-discovery-service:8761/eureka/}
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-nexus-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      # For real Git repo (production):
      # GIT_URI: ${GIT_URI}
      # GIT_USERNAME: ${GIT_USERNAME}
      # GIT_PASSWORD: ${GIT_PASSWORD}
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      ENVIRONMENT: production
    volumes:
      - config-repo-prod:/config-repo
    depends_on:
      nexus-config-repo-init:
        condition: service_completed_successfully
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
