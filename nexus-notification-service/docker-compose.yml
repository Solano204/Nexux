# ══════════════════════════════════════════════════════════════════════
# nexus-notification-service — LOCAL DEVELOPMENT Docker Compose
# Profile: docker  (SPRING_PROFILES_ACTIVE=docker)
#
# Infrastructure (no PostgreSQL — this service uses only MongoDB + Redis):
#   MongoDB 7         (port 27017) — NotificationDocument + UserPreferences
#   Redis 7           (port 6379)  — dedup cache (prevent duplicate notifications)
#   Kafka + Zookeeper (port 9092)  — 4 consumer groups across 8 topics:
#     identity:   users.registered, identity.verified, identity.rejected, accounts.created
#     fraud:      fraud.flagged
#     txn:        transactions.completed, transactions.failed
#     saga:       saga.commands  (NOTIFY_* commands)
#   nexus-config-service   (port 8888)
#   nexus-discovery-service (port 8761)
#   Zipkin, Prometheus, Loki, Grafana
#   nexus-notification-service (port 8089)
#
# OpenAI:
#   Set OPENAI_API_KEY in your shell or .env file.
#   If empty, FallbackContentGenerator kicks in (template-based, no AI).
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mongodb-notification-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ────────────────────────────────────────────────────────────
  # MONGODB — notification documents + user preferences
  # Collections: notifications, user_notification_preferences
  # ────────────────────────────────────────────────────────────
  nexus-mongodb:
    image: mongo:7.0
    container_name: nexus-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: nexus_dev_password
      MONGO_INITDB_DATABASE: nexus_notification
    ports:
      - "27017:27017"
    volumes:
      - mongodb-notification-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.6
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ────────────────────────────────────────────────────────────
  # REDIS — notification dedup cache
  # Key pattern: notification:dedup:{userId}:{eventType}:{hash}
  # TTL: 24h (prevents duplicate send within same day)
  # ────────────────────────────────────────────────────────────
  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ────────────────────────────────────────────────────────────
  # KAFKA — 4 consumer groups across 8 topics
  # ────────────────────────────────────────────────────────────
  nexus-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    restart: unless-stopped
    depends_on:
      nexus-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://nexus-kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # SPRING CLOUD INFRASTRUCTURE
  # ────────────────────────────────────────────────────────────
  nexus-config-service:
    image: nexusplatform/nexus-config-service:latest
    container_name: nexus-config-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nexus-discovery-service:
    image: nexusplatform/nexus-discovery-service:latest
    container_name: nexus-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    depends_on:
      nexus-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # OBSERVABILITY
  # ────────────────────────────────────────────────────────────
  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - nexus-network

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network

  nexus-promtail:
    image: grafana/promtail:2.9.3
    container_name: nexus-promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - nexus-network
    depends_on:
      - nexus-loki

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nexus-network
    depends_on:
      - nexus-prometheus
      - nexus-loki

  # ────────────────────────────────────────────────────────────
  # NOTIFICATION SERVICE
  # ────────────────────────────────────────────────────────────
  nexus-notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-notification-service
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # MongoDB
      MONGODB_URI: mongodb://nexus:nexus_dev_password@nexus-mongodb:27017/nexus_notification?authSource=admin
      # Redis
      REDIS_HOST: nexus-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      # Eureka
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      # Spring AI — empty = FallbackContentGenerator used instead
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Observability
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: "1.0"
      ENVIRONMENT: local-docker
    depends_on:
      nexus-mongodb:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-kafka:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
      nexus-zipkin:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.34
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8089/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
