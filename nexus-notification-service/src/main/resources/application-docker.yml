# ══════════════════════════════════════════════════════════════
# nexus-notification-service — DOCKER profile
# Active when: SPRING_PROFILES_ACTIVE=docker
# Set automatically by Dockerfile ENTRYPOINT: -Dspring.profiles.active=docker
#
# Purpose: Override all localhost addresses with Docker Compose
#          service names. This is the ONLY difference from dev.
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      uri: http://nexus-config-service:8888
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
    bus:
      enabled: true

  threads:
    virtual:
      enabled: true

  # ── MongoDB ────────────────────────────────────────────────
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://nexus:nexus_dev@nexus-mongodb:27017/nexus_notification?authSource=admin}
      auto-index-creation: false    # Indexes managed by mongo-init.js

    # ── Redis ────────────────────────────────────────────────
    redis:
      host: nexus-redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 100ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 5
          min-idle: 2
          max-wait: 100ms

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: nexus-kafka:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      max-poll-records: 100
    listener:
      ack-mode: manual

  # ── Spring AI ──────────────────────────────────────────────
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

server:
  port: 8089

# ── Eureka ─────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

resilience4j:
  retry:
    instances:
      openai-retry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2

# ── Observability ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        notification.ai.generation.duration: true
      percentiles:
        notification.ai.generation.duration: 0.5, 0.9, 0.95, 0.99
    tags:
      application: nexus-notification-service
      environment: docker
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    com.nexus.notification: INFO
    org.springframework.data.mongodb: WARN
    org.springframework.kafka: WARN
    io.lettuce: WARN
