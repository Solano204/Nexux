name: Terraform — plan on PR

# 05_TERRAFORM_AWS_CHANGES.md Section 7. Consistent with ci-pr.yml's
# conventions (ubuntu-latest, actions/checkout, path-filtered so this
# only runs when terraform/** actually changed).
#
# PREREQUISITE, not yet done: `terraform init` here needs a remote backend
# to fetch state from in a fresh CI checkout (no local .tfstate exists on
# the runner). This workflow will fail at init until Section 1's S3 backend
# migration is applied (main.tf's backend "s3" block is still commented
# out as of this writing) - not a bug in this file, a real ordering
# dependency between Section 1 and Section 7. It will also fail at the
# "Configure AWS credentials" step since secrets.TERRAFORM_CI_ROLE_ARN is
# not configured yet (confirmed with Carlos, 2026-07-18) — both are safe,
# visible failures (a red X on the PR), not silent no-ops.

on:
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch: {}

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write      # required for OIDC
  contents: read
  pull-requests: write # to post the plan as a PR comment

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # Points at the CURRENT flat terraform/ layout, not the
        # environments/{dev,prod} split proposed in Section 2 - that
        # restructuring moves 17 files already tracked in real state and
        # needs its own reviewed pass, not bundled into this workflow.
        # Update this path if/when that restructuring happens.
        working-directory: terraform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.11.4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform fmt -check
        run: terraform fmt -check -recursive .

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan\n\`\`\`\n${plan}\n\`\`\``
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
