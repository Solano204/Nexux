# ══════════════════════════════════════════════════════════════
# NEXUS PLATFORM — Complete Docker Infrastructure
# Runs: Redis + Kafka 4.2.0 (KRaft) + Elasticsearch 8 + Kafka UI
#
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Logs:    docker compose logs -f
#
# Ports:
#   Redis:         localhost:6379
#   Kafka:         localhost:9092
#   Kafka UI:      http://localhost:8090
#   Elasticsearch: http://localhost:9200
# ══════════════════════════════════════════════════════════════

services:

  # ── Redis ────────────────────────────────────────────────────
  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Kafka 4.2.0 (KRaft — no Zookeeper) ──────────────────────
  nexus-kafka:
    image: apache/kafka:latest
    container_name: nexus-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@nexus-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://nexus-kafka:29092,CONTROLLER://nexus-kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://nexus-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ── Kafka Topic Creator — runs once then exits ───────────────
  nexus-kafka-topics:
    image: apache/kafka:latest
    container_name: nexus-kafka-topics
    depends_on:
      nexus-kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo 'Creating all Nexus Kafka topics...'
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic saga.commands               --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic saga.replies                --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic saga.completed              --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic transactions.saga.completed --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic transactions.saga.failed    --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic transactions.initiated      --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic transactions.completed      --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic transactions.failed         --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic transactions.velocity       --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic transactions.merchant-stats --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic fraud.result                --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic fraud.flagged               --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic ledger.posted               --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic ledger.reversed             --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic users.registered            --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic identity.verified           --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic identity.rejected           --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic identity.kyc.initiate       --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic identity.kyc.initiations    --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic identity.kyc.result         --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic identity.ai.kyc.explain     --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic accounts.created            --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic account.frozen              --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic risk.profile.updated        --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic user.behavior.aggregated    --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic analytics.anomalies.detected --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic ai.query.logged             --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic tool.transfer.initiated     --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic tool.transfer.unauthorized  --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server nexus-kafka:29092 --create --if-not-exists --topic springCloudBus             --partitions 1 --replication-factor 1
        echo '✅ All 30 topics created!'

  # ── Kafka UI ─────────────────────────────────────────────────
  nexus-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexus-kafka-ui
    restart: unless-stopped
    depends_on:
      nexus-kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nexus-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: nexus-kafka:29092

  # ── Elasticsearch 8 ──────────────────────────────────────────
  nexus-elasticsearch:
    image: elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s