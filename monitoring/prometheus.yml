global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nexus-config-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-config-service:8888']

  - job_name: nexus-discovery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-discovery-service:8761']

  - job_name: nexus-api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-api-gateway:8080']

  - job_name: nexus-identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-identity-service:8083']

  - job_name: nexus-account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-account-service:8085']

  - job_name: nexus-transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-transaction-service:8086']

  - job_name: nexus-fraud-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-fraud-service:8087']

  - job_name: nexus-ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-ledger-service:8088']

  - job_name: nexus-notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-notification-service:8089']

  - job_name: nexus-ai-assistant-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-ai-assistant-service:8090']

  - job_name: nexus-ai-kyc-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-ai-kyc-service:8091']

  - job_name: nexus-analytics-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-analytics-service:8092']

  - job_name: nexus-risk-scoring-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-risk-scoring-service:8094']

  - job_name: nexus-saga-orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-saga-orchestrator:8095']

  - job_name: nexus-audit-query-jvm
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nexus-audit-query-jvm:8097']

  - job_name: nexus-audit-write-native
    metrics_path: /q/metrics
    static_configs:
      - targets: ['nexus-audit-write-native:8096']
