spring:
  config:
    import: ""

  cloud:
    config:
      enabled: false

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_identity
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: nexus-identity-dev-pool

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6380
      password: ""

  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: identity-service-saga-commands-dev

nexus:
  jwt:
    keystore:
      path: ./keys/nexus-identity.jks
      password: dev_keystore_password

  aws:
    endpoint-override: http://localhost:4566
    kyc-queue-url: http://localhost:4566/000000000000/nexus-kyc-documents-pending

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9412/api/v2/spans

logging:
  level:
    com.nexus.identity: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
