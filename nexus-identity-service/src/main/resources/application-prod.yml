spring:
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://nexus-config-service:8888}
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
    bus:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_identity}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:nexus-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
  instance:
    health-check-url-path: /actuator/health

nexus:
  jwt:
    keystore:
      path: ${JWT_KEYSTORE_PATH:/secrets/nexus-identity.jks}
      password: ${JWT_KEYSTORE_PASSWORD}
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint-override: ""
    kyc-bucket: ${KYC_S3_BUCKET:nexus-kyc-documents}
    kyc-queue-url: ${KYC_SQS_QUEUE_URL}
    cognito-user-pool-id: ${COGNITO_USER_POOL_ID:}
    cognito-client-id: ${COGNITO_CLIENT_ID:}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    root: WARN
    com.nexus.identity: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
