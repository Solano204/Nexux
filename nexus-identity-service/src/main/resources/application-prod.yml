spring:
  cloud:
    config:
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}
    bus:
      enabled: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}

nexus:
  jwt:
    keystore:
      path: ${JWT_KEYSTORE_PATH:/secrets/nexus-identity.jks}
      password: ${JWT_KEYSTORE_PASSWORD}
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint-override: ""
    kyc-bucket: ${KYC_S3_BUCKET:nexus-kyc-documents}
    kyc-queue-url: ${KYC_SQS_QUEUE_URL}

management:
  tracing:
    enabled: true
    sampling:
      probability: 0.05
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    root: WARN
    com.nexus.identity: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
