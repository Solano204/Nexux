server:
  port: 8083

spring:
  application:
    name: nexus-identity-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexus_identity}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:nexus_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: nexus-identity-pool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: identity-service-saga-commands
      auto-offset-reset: earliest
      enable-auto-commit: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

nexus:
  jwt:
    keystore:
      path: ${JWT_KEYSTORE_PATH:./keys/nexus-identity.jks}
      password: ${JWT_KEYSTORE_PASSWORD:dev_keystore_password}
    access-token-expiry-seconds: 3600
    issuer: nexus-identity-service
    audience: nexus-platform
    key:
      rotation-days: 90
      rotation-check-hours: 24

  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint-override: ${AWS_ENDPOINT:http://localhost:4566}
    kyc-bucket: ${KYC_S3_BUCKET:nexus-kyc-documents}
    kyc-queue-url: ${KYC_QUEUE_URL:http://localhost:4566/000000000000/nexus-kyc-documents-pending}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9412/api/v2/spans}

logging:
  level:
    com.nexus.identity: INFO
    org.springframework.security: WARN
