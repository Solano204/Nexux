server:
  port: 8010
  tomcat:
    threads:
      max: 100
    accept-count: 50

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true

spring:
  application:
    name: nexus-identity-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      # disabled: Brave's ThreadLocal trace context doesn't survive virtual
      # thread mount/unmount - controller-dispatched spans (register, login,
      # jwks) were silently never exported to Zipkin, confirmed live on this
      # service (actuator/internal spans traced fine).
      enabled: false

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexus_identity}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:nexus_dev_password}
    hikari:
      # Fase 8: connection-timeout was missing (30s default vs. the 5s
      # HTTP ceiling from Fase 1) — see account-service for the full
      # reasoning.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      pool-name: nexus-identity-pool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: identity-service-saga-commands
      auto-offset-reset: earliest
      enable-auto-commit: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

nexus:
  load-shedding:
    max-in-flight: 80
  jwt:
    keystore:
      path: ${JWT_KEYSTORE_PATH:./keys/nexus-identity.jks}
      password: ${JWT_KEYSTORE_PASSWORD:dev_keystore_password}
    access-token-expiry-seconds: 3600
    issuer: nexus-identity-service
    audience: nexus-platform
    key:
      rotation-days: 90
      rotation-check-hours: 24

  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint-override: ${AWS_ENDPOINT:}
    kyc-bucket: ${KYC_S3_BUCKET:nexus-kyc-documents}
    # SqsKycPublisher reads nexus.aws.kyc-queue-url. docker-compose-prod.yml
    # sets KYC_SQS_QUEUE_URL (see the ":?required" env var), not KYC_QUEUE_URL
    # - this was reading the wrong name and always resolving empty, so the
    # audit-trail tracking message to the kyc-pending queue never sent (the
    # core KYC decision path via Kafka + OpenAI is unaffected by this).
    kyc-queue-url: ${KYC_SQS_QUEUE_URL:}
    cognito-user-pool-id: ${COGNITO_USER_POOL_ID:}
    cognito-client-id: ${COGNITO_CLIENT_ID:}

resilience4j:
  circuitbreaker:
    instances:
      cognito:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3000ms
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.nexus.identity: INFO
    org.springframework.security: WARN
