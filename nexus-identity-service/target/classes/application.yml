# src/main/resources/application.yml

spring:
  application:
    name: nexus-identity-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: http://nexus-config-service:8888
      fail-fast: true
      retry:
        max-attempts: 10

  # ════════════════════════════════════════════════════════════
  # VIRTUAL THREADS — Java 25 (all request handlers run on VT)
  # BCrypt 300ms blocks are transparent to carrier threads
  # ════════════════════════════════════════════════════════════
  threads:
    virtual:
      enabled: true

  # ════════════════════════════════════════════════════════════
  # JPA + POSTGRESQL
  # ════════════════════════════════════════════════════════════
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_identity}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: nexus-identity-pool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true

  # Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ════════════════════════════════════════════════════════════
  # REDIS
  # ════════════════════════════════════════════════════════════
  data:
    redis:
      host: ${REDIS_HOST:nexus-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms

  cache:
    type: redis
    redis:
      time-to-live: 60000  # 60 seconds for user profile cache

  # ════════════════════════════════════════════════════════════
  # KAFKA — Consumer only (saga.commands) + Cloud Bus
  # ════════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
    consumer:
      group-id: identity-service-saga-commands
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

  # ════════════════════════════════════════════════════════════
  # SPRING AI — GPT-4o-mini for KYC rejection explanation
  # ════════════════════════════════════════════════════════════
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

server:
  port: 8083
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200  # Virtual Threads handle blocking — platform threads are few
      min-spare: 10

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

# JWT Configuration
nexus:
  jwt:
    keystore:
      path: ${JWT_KEYSTORE_PATH:/app/keys/nexus-identity.jks}
      password: ${JWT_KEYSTORE_PASSWORD:changeme-in-production}
    access-token-expiry-seconds: 900      # 15 minutes
    issuer: nexus-identity-service
    audience: nexus-platform
    key:
      rotation-days: 90
      rotation-check-hours: 24

  aws:
    region: ${AWS_REGION:us-east-1}
    kyc-bucket: ${KYC_DOCUMENTS_BUCKET:nexus-kyc-documents}
    kyc-queue-url: ${KYC_SQS_QUEUE_URL:}

# ══════════════════════════════════════════════════════════════
# OBSERVABILITY
# ══════════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers,
          busrefresh,caches
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        identity.bcrypt.duration: true
        http.server.requests: true
      percentiles:
        identity.bcrypt.duration: 0.5, 0.9, 0.95, 0.99
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    com.nexus.identity: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level
      traceId=%X{traceId} spanId=%X{spanId}
      service=nexus-identity-service %logger{36} - %msg%n