# ══════════════════════════════════════════════════════════════════════
# nexus-identity-service — LOCAL DEVELOPMENT Docker Compose
# Profile: docker  (SPRING_PROFILES_ACTIVE=docker)
#
# What this file runs:
#   Infrastructure:  PostgreSQL, Redis, Kafka+Zookeeper
#   Spring Cloud:    nexus-config-service, nexus-discovery-service
#   Observability:   Zipkin, Prometheus, Loki, Promtail, Grafana
#   AWS (local):     LocalStack (S3 + SQS — replaces real AWS in dev)
#   The service:     nexus-identity-service on port 8083
#
# Usage:
#   docker compose up -d
#   docker compose logs -f nexus-identity-service
#
# Ports exposed on localhost:
#   8083  — Identity Service  (http://localhost:8083)
#   8888  — Config Service    (http://localhost:8888)
#   8761  — Eureka            (http://localhost:8761)
#   5432  — PostgreSQL        (psql -h localhost -U nexus -d nexus_identity)
#   6379  — Redis
#   9092  — Kafka
#   4566  — LocalStack        (http://localhost:4566)
#   9411  — Zipkin            (http://localhost:9411)
#   3000  — Grafana           (http://localhost:3000  admin/admin)
#   9090  — Prometheus        (http://localhost:9090)
#
# JWT Keystore:
#   The identity service needs a JKS file at /app/keys/nexus-identity.jks.
#   For local dev: run  scripts/generate-keystore.sh  first.
#   This creates  keys/nexus-identity.jks  which is mounted into the container.
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-identity-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  prometheus-data:
  grafana-data:
  loki-data:
  localstack-data:

services:

  # ────────────────────────────────────────────────────────────
  # POSTGRESQL — identity service database
  # ────────────────────────────────────────────────────────────
  nexus-postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus_identity
      # Allow all connections inside the Docker network
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
      # Init script creates the database if it doesn't exist
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_identity"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ────────────────────────────────────────────────────────────
  # REDIS — JWT blacklist + session cache
  # ────────────────────────────────────────────────────────────
  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ────────────────────────────────────────────────────────────
  # KAFKA — SAGA commands consumer + Cloud Bus
  # ────────────────────────────────────────────────────────────
  nexus-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    restart: unless-stopped
    depends_on:
      nexus-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://nexus-kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # LOCALSTACK — AWS S3 + SQS emulation for local dev
  # S3:  stores KYC document uploads
  # SQS: nexus-kyc-documents-pending queue
  # ────────────────────────────────────────────────────────────
  nexus-localstack:
    image: localstack/localstack:3.2
    container_name: nexus-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
      DEBUG: "0"
      DATA_DIR: /var/lib/localstack/data
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      # Auto-setup script creates the bucket and queue on startup
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.15
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ────────────────────────────────────────────────────────────
  # SPRING CLOUD INFRASTRUCTURE
  # ────────────────────────────────────────────────────────────
  nexus-config-service:
    image: nexusplatform/nexus-config-service:latest
    container_name: nexus-config-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nexus-discovery-service:
    image: nexusplatform/nexus-discovery-service:latest
    container_name: nexus-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    depends_on:
      nexus-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # OBSERVABILITY STACK
  # ────────────────────────────────────────────────────────────
  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - nexus-network

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network

  nexus-promtail:
    image: grafana/promtail:2.9.3
    container_name: nexus-promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - nexus-network
    depends_on:
      - nexus-loki

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nexus-network
    depends_on:
      - nexus-prometheus
      - nexus-loki

  # ────────────────────────────────────────────────────────────
  # IDENTITY SERVICE
  # ────────────────────────────────────────────────────────────
  nexus-identity-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-identity-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # PostgreSQL
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_identity
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      # Redis
      REDIS_HOST: nexus-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      # Eureka
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      # JWT keystore (mounted volume)
      JWT_KEYSTORE_PATH: /app/keys/nexus-identity.jks
      JWT_KEYSTORE_PASSWORD: dev_keystore_password
      # AWS — points to LocalStack
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_OVERRIDE: http://nexus-localstack:4566
      KYC_DOCUMENTS_BUCKET: nexus-kyc-documents
      KYC_SQS_QUEUE_URL: http://nexus-localstack:4566/000000000000/nexus-kyc-documents-pending
      # OpenAI — KYC rejection explainer (can be empty in dev)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Observability
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: "1.0"
      ENVIRONMENT: local-docker
    volumes:
      # JWT KeyStore — generate with scripts/generate-keystore.sh first
      - ./keys:/app/keys:ro
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-kafka:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
      nexus-localstack:
        condition: service_healthy
      nexus-zipkin:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.31
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
