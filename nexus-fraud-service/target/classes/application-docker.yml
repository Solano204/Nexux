# ══════════════════════════════════════════════════════════════
# Docker profile overrides for nexus-fraud-service
# Activated via SPRING_PROFILES_ACTIVE=docker
# ══════════════════════════════════════════════════════════════
spring:
  datasource:
    url: jdbc:postgresql://nexus-postgres:5432/nexus_fraud
  data:
    redis:
      host: nexus-redis
  kafka:
    bootstrap-servers: nexus-kafka:9092
  elasticsearch:
    uris: http://nexus-elasticsearch:9200

eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/

management:
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    com.nexus.fraud: DEBUG