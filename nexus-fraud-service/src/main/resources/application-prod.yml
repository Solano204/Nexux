# ══════════════════════════════════════════════════════════════
# nexus-fraud-service — PRODUCTION profile
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      uri: ${CONFIG_SERVICE_URI:http://nexus-config-service:8888}
      enabled: true
      fail-fast: true
      retry:
        max-attempts: 15
        initial-interval: 2000
        max-interval: 15000
        multiplier: 1.5
    bus:
      enabled: true

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      data-source-properties:
        application_name: nexus-fraud-service-prod
        lock_timeout: 10000
        statement_timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:nexus-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 100ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 50ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
    producer:
      acks: all
      enable-idempotence: true
    consumer:
      group-id: fraud-service-saga-commands
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1    # Low temp required for reproducible fraud decisions
    vectorstore:
      pgvector:
        initialize-schema: false     # Schema already created
        table-name: fraud_policy_embeddings

  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://nexus-elasticsearch:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      openai:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    com.nexus.fraud: INFO
    com.nexus.fraud.agent: INFO   # Keep agent logs visible in prod
    org.springframework.ai: WARN
    org.hibernate: WARN
    org.flywaydb: WARN
    io.lettuce: WARN
    com.netflix.eureka: WARN
    root: WARN
