spring:
  application:
    name: nexus-fraud-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      # disabled: Brave's ThreadLocal trace context doesn't survive virtual
      # thread mount/unmount - controller-dispatched spans were silently
      # never exported to Zipkin (actuator/internal spans traced fine).
      enabled: false

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexus_fraud}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:nexus_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      data-source-properties:
        application_name: nexus-fraud-service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: fraud-service-saga-commands
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    listener:
      ack-mode: manual

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: fraud_policy_embeddings
        schema-validation: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9201}

server:
  port: 8087

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

nexus:
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint-override: ${AWS_ENDPOINT:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    # FraudAnalysisService.fraudAlertQueueUrl reads nexus.aws.fraud-alert-queue-url -
    # this was never bound to any env var, so it was always empty and
    # publishFraudAlertToSqs() never fired regardless of FRAUD_ALERTS_QUEUE_URL
    # being set in .env/docker-compose-prod.yml.
    fraud-alert-queue-url: ${FRAUD_ALERTS_QUEUE_URL:}

resilience4j:
  circuitbreaker:
    instances:
      openai:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      transaction-service:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      transaction-service-reads:
        max-attempts: 2
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.net.ConnectException

  ratelimiter:
    instances:
      # Client-side throttle for FraudLlmGateway's 3 OpenAI call sites
      # (plan/executeTool/synthesize) - the "openai" CircuitBreaker above
      # only reacts to sustained failures, it does nothing to stop
      # concurrent fraud analyses from bursting past OpenAI's per-minute
      # limit in the first place. Same pattern/incident basis as
      # nexus-risk-scoring-service's openAiRateLimiter. See
      # CHANGES-BESTPRACTICES/10_ARCHITECTURE_PATTERNS_CHANGES.md Fase 2.
      openai:
        limit-for-period: 20
        limit-refresh-period: 1m
        timeout-duration: 30s

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,retries,ratelimiters
  metrics:
    distribution:
      percentiles-histogram:
        fraud.analysis.duration.seconds: true
      percentiles:
        fraud.analysis.duration.seconds: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9412/api/v2/spans}

logging:
  level:
    com.nexus.fraud: INFO
    org.springframework.ai: INFO
