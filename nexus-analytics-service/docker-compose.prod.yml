# ══════════════════════════════════════════════════════════════════════
# nexus-analytics-service — PRODUCTION Docker Compose
#
# Required env vars:
#   REDIS_PASSWORD, ELASTICSEARCH_PASSWORD, OPENAI_API_KEY (optional),
#   GRAFANA_ADMIN_PASSWORD
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  elasticsearch-analytics-data-prod:
  redis-data-prod:
  kafka-streams-state-prod:    # Persists RocksDB state across restarts
  prometheus-data-prod:
  grafana-data-prod:
  loki-data-prod:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:

  nexus-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.name: nexus-analytics-cluster-prod
    volumes:
      - elasticsearch-analytics-data-prod:/usr/share/elasticsearch/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.7
    logging: *default-logging
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data-prod:/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-config-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-config-service:${IMAGE_TAG:-latest}
    container_name: nexus-config-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nexus-discovery-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-discovery-service:${IMAGE_TAG:-latest}
    container_name: nexus-discovery-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    logging: *default-logging
    depends_on:
      nexus-config-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: always
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: always
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-prod:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - nexus-network
    logging: *default-logging

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: always
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data-prod:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network
    logging: *default-logging

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-prod:/var/lib/grafana
    networks:
      - nexus-network
    logging: *default-logging
    depends_on:
      - nexus-prometheus
      - nexus-loki

  nexus-analytics-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-analytics-service:${IMAGE_TAG:-latest}
    container_name: nexus-analytics-service
    restart: always
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ELASTICSEARCH_URIS: http://nexus-elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      REDIS_HOST: nexus-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexus-kafka:9092}
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      ENVIRONMENT: production
    volumes:
      - kafka-streams-state-prod:/var/kafka-streams
    depends_on:
      nexus-elasticsearch:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.38
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2.5g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8092/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
