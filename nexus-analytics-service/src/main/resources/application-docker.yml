# ══════════════════════════════════════════════════════════════
# nexus-analytics-service — DOCKER profile
# Active when: SPRING_PROFILES_ACTIVE=docker
# Set automatically by Dockerfile ENTRYPOINT: -Dspring.profiles.active=docker
#
# Purpose: Override all localhost addresses with Docker Compose
#          service names. This is the ONLY difference from dev.
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      uri: http://nexus-config-service:8888
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
    bus:
      enabled: true

  threads:
    virtual:
      enabled: true

  # ── Elasticsearch ──────────────────────────────────────────
  data:
    elasticsearch:
      uris: http://nexus-elasticsearch:9200

    # ── Redis ────────────────────────────────────────────────
    redis:
      host: nexus-redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 100ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 5
          min-idle: 2
          max-wait: 100ms

  # ── Kafka + Kafka Streams ──────────────────────────────────
  kafka:
    bootstrap-servers: nexus-kafka:9092
    producer:
      acks: "1"
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    streams:
      application-id: nexus-analytics-streams
      num-stream-threads: 4
      state-dir: /var/kafka-streams
      cache-max-bytes-buffering: 52428800
      commit-interval-ms: 1000
      processing-guarantee: at_least_once
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        replication.factor: "1"
        rocksdb.block.cache.size.mb: "256"

  # ── Spring AI ──────────────────────────────────────────────
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.4

server:
  port: 8092

# ── Eureka ─────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

resilience4j:
  retry:
    instances:
      openai-retry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2

# ── Observability ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        analytics.insight.generation.duration: true
      percentiles:
        analytics.insight.generation.duration: 0.5, 0.9, 0.95, 0.99
    tags:
      application: nexus-analytics-service
      environment: docker
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}    # 10% — high-volume streams
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    com.nexus.analytics: INFO
    org.apache.kafka.streams: WARN
    org.springframework.data.elasticsearch: WARN
    org.springframework.ai: INFO
    io.lettuce: WARN
