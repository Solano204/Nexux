# ══════════════════════════════════════════════════════════════
# nexus-analytics-service — DEV profile
# Active when: SPRING_PROFILES_ACTIVE=dev
#
# Prerequisites:
#   docker compose up -d nexus-elasticsearch nexus-redis nexus-kafka \
#     nexus-config-service nexus-discovery-service
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      enabled: false
      fail-fast: false

  threads:
    virtual:
      enabled: true

  data:
    elasticsearch:
      uris: http://localhost:9200
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 500ms

  kafka:
    bootstrap-servers: localhost:9092
    streams:
      application-id: nexus-analytics-streams-dev
      state-dir: /tmp/kafka-streams-dev
      processing-guarantee: at_least_once
      num-stream-threads: 2   # Fewer threads in dev

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.4

server:
  port: 8092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.nexus.analytics: DEBUG
    org.apache.kafka.streams: DEBUG
    org.springframework.data.elasticsearch: DEBUG
    org.springframework.ai: DEBUG
    io.lettuce: DEBUG
