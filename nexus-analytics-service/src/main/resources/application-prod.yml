spring:
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://nexus-config-service:8888}
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
    bus:
      enabled: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://nexus-elasticsearch:9200}

  data:
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://nexus-elasticsearch:9200}
    redis:
      host: ${REDIS_HOST:nexus-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
    streams:
      num-stream-threads: 4
      state-dir: /var/kafka-streams
      cache-max-bytes-buffering: 52428800

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
  instance:
    health-check-url-path: /actuator/health

management:
  tracing:
    enabled: true
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    root: WARN
    com.nexus.analytics: INFO
    org.apache.kafka: WARN
    org.apache.kafka.streams: WARN
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
