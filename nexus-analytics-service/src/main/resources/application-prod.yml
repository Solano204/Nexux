spring:
  cloud:
    config:
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}
    bus:
      enabled: true

  kafka:
    streams:
      num-stream-threads: 4
      state-dir: /var/kafka-streams
      cache-max-bytes-buffering: 52428800

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}

management:
  tracing:
    enabled: true
    sampling:
      probability: 0.05
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    root: WARN
    com.nexus.analytics: INFO
    org.apache.kafka: WARN
    org.apache.kafka.streams: WARN
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
