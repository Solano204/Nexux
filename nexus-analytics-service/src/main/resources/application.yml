spring:
  application:
    name: nexus-analytics-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      # disabled: Brave's ThreadLocal trace context doesn't survive virtual
      # thread mount/unmount - controller-dispatched spans were silently
      # never exported to Zipkin (actuator/internal spans traced fine).
      enabled: false

  data:
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://localhost:9201}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    streams:
      application-id: nexus-analytics-streams
      num-stream-threads: 4
      state-dir: /var/kafka-streams
      cache-max-bytes-buffering: 52428800
      commit-interval-ms: 1000
      processing-guarantee: at_least_once
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        replication.factor: "1"
        rocksdb.block.cache.size.mb: "256"

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.4

server:
  port: 8092
  tomcat:
    threads:
      max: 50
    accept-count: 25

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true

nexus:
  load-shedding:
    max-in-flight: 40

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

resilience4j:
  retry:
    instances:
      openai-retry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  health:
    elasticsearch:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        analytics.insight.generation.duration: true
      percentiles:
        analytics.insight.generation.duration: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9412/api/v2/spans}

logging:
  level:
    com.nexus.saga: DEBUG          # tus logs de negocio — los únicos que quieres ver
    org.springframework.kafka: WARN
    org.apache.kafka.clients: WARN
    org.springframework.kafka.listener.KafkaMessageListenerContainer: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
    org.springframework.ai: WARN

