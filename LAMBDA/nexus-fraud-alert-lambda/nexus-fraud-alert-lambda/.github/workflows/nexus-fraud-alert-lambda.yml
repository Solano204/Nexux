# .github/workflows/nexus-fraud-alert-lambda.yml
#
# Java 21 Lambda with SnapStart + SQS trigger.
# IMPORTANT: ComplianceTeamEmail MUST be set as a GitHub secret
# or hardcoded in samconfig.toml parameter_overrides before deploy.

name: Nexus Fraud Alert Lambda Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'nexus-fraud-alert-lambda/**'
      - '.github/workflows/nexus-fraud-alert-lambda.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'nexus-fraud-alert-lambda/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  AWS_REGION: us-east-1

jobs:

  # ════════════════════════════════════════════════════════════
  # STAGE 1: BUILD + TEST
  # Tests cover: AlertClassifier, SarEvaluator, handler routing
  # ════════════════════════════════════════════════════════════
  build-test:
    name: Build + Test (AlertClassifier + SAR Evaluator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-fraud-alert-lambda

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build fat JAR
        run: mvn package --no-transfer-progress

      - name: Run Tests
        run: mvn test --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-fraud-alert-lambda-jar-${{ github.sha }}
          path: nexus-fraud-alert-lambda/target/nexus-fraud-alert-lambda-1.0.0.jar
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # STAGE 2: SAM BUILD + VALIDATE
  # ════════════════════════════════════════════════════════════
  sam-build:
    name: SAM Build + Validate
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-fraud-alert-lambda

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-fraud-alert-lambda-jar-${{ github.sha }}
          path: nexus-fraud-alert-lambda/target/

      - name: SAM Validate
        run: sam validate --template template.yaml --lint

      - name: SAM Build
        run: sam build --template template.yaml

      - name: Upload SAM build
        uses: actions/upload-artifact@v4
        with:
          name: sam-build-fraud-alert-${{ github.sha }}
          path: nexus-fraud-alert-lambda/.aws-sam/
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # STAGE 3: DEPLOY TO STAGING
  # ════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    needs: sam-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: nexus-fraud-alert-lambda

    steps:
      - uses: actions/checkout@v4

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download SAM build
        uses: actions/download-artifact@v4
        with:
          name: sam-build-fraud-alert-${{ github.sha }}
          path: nexus-fraud-alert-lambda/.aws-sam/

      - name: SAM Deploy to Staging
        run: |
          sam deploy \
            --config-env staging \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              "ComplianceTeamEmail=${{ secrets.COMPLIANCE_EMAIL_STAGING }}"

  # ════════════════════════════════════════════════════════════
  # STAGE 4: DEPLOY TO PRODUCTION
  # ════════════════════════════════════════════════════════════
  deploy-prod:
    name: Deploy to Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: nexus-fraud-alert-lambda

    steps:
      - uses: actions/checkout@v4

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download SAM build
        uses: actions/download-artifact@v4
        with:
          name: sam-build-fraud-alert-${{ github.sha }}
          path: nexus-fraud-alert-lambda/.aws-sam/

      - name: SAM Deploy to Production
        run: |
          sam deploy \
            --config-env prod \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              "ComplianceTeamEmail=${{ secrets.COMPLIANCE_EMAIL_PROD }}"
