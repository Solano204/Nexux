<!-- transaction-failed.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{_layout :: layout(~{::body-content})}">
<head><title>Transferencia no completada</title></head>
<body>
<th:block th:fragment="body-content">
    <p style="color:#dc2626;font-weight:700;">
        ❌ Tu transferencia no pudo ser procesada
    </p>
    <table style="width:100%;border-collapse:collapse;margin:16px 0;">
        <tr>
            <td style="color:#6b7280;padding:8px 0;">Monto</td>
            <td style="font-weight:700;text-align:right;"
                th:text="${currency + ' ' + amount}">MXN 0.00</td>
        </tr>
        <tr>
            <td style="color:#6b7280;padding:8px 0;">Destinatario</td>
            <td style="text-align:right;"
                th:text="${targetName ?: 'N/A'}">N/A</td>
        </tr>
        <tr>
            <td style="color:#6b7280;padding:8px 0;">Motivo</td>
            <td style="text-align:right;color:#dc2626;"
                th:text="${failureReason ?: 'Error en el procesamiento'}">Error</td>
        </tr>
    </table>
    <p>El monto no fue debitado de tu cuenta. Puedes intentar nuevamente.</p>
</th:block>
</body>
</html>
