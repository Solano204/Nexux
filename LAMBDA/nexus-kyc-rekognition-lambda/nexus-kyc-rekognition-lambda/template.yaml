# template.yaml — AWS SAM
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Nexus KYC Rekognition Lambda.
  S3-triggered: fires when a user uploads an ID document.
  Runs parallel Rekognition text + face detection.
  Applies quality gates (brightness, sharpness, text count).
  Publishes structured result to SQS for nexus-ai-kyc-service.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        KYC_DOCUMENTS_BUCKET: !Ref KycDocumentsBucket
        RESULTS_QUEUE_URL: !Ref KycRekognitionResultsQueue
        MIN_FACE_QUALITY_BRIGHTNESS: "40"
        MIN_FACE_QUALITY_SHARPNESS: "40"
        MIN_TEXT_ELEMENT_COUNT: "5"
        MIN_TEXT_CONFIDENCE: "70"
        MAX_DOCUMENT_SIZE_BYTES: "10485760"  # 10 MB
        MIN_DOCUMENT_SIZE_BYTES: "10000"     # 10 KB
        SUPPORTED_CONTENT_TYPES: "image/jpeg,image/png,image/webp"
        LOG_LEVEL: "INFO"
        AWS_REGION_NAME: !Ref AWS::Region

Resources:

  # ── Lambda Function ───────────────────────────────────────
  KycRekognitionLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nexus-kyc-rekognition-lambda
      Handler: src/handler.process_kyc_document
      CodeUri: .

      # No SnapStart: Python Lambda, S3-triggered.
      # Python cold starts ~200-500ms, acceptable for async doc processing.
      # SQS-consumer (nexus-ai-kyc-service) waits for this result anyway.

      Policies:
        # Read the uploaded document from S3
        - S3ReadPolicy:
            BucketName: !Ref KycDocumentsBucket
        # Tag the S3 object with processing status
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObjectTagging
                - s3:GetObjectTagging
              Resource: !Sub
                "arn:aws:s3:::${KycDocumentsBucket}/kyc/*"
        # Rekognition text + face detection only
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectText
                - rekognition:DetectFaces
              Resource: "*"
        # Publish results to SQS
        - SQSSendMessagePolicy:
            QueueName: !GetAtt KycRekognitionResultsQueue.QueueName
        # CloudWatch custom metrics
        - CloudWatchPutMetricPolicy: {}

      Events:
        S3TriggerJpg:
          Type: S3
          Properties:
            Bucket: !Ref KycDocumentsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "kyc/"
                  - Name: suffix
                    Value: ".jpg"
        S3TriggerPng:
          Type: S3
          Properties:
            Bucket: !Ref KycDocumentsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "kyc/"
                  - Name: suffix
                    Value: ".png"
        S3TriggerWebp:
          Type: S3
          Properties:
            Bucket: !Ref KycDocumentsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "kyc/"
                  - Name: suffix
                    Value: ".webp"

  # ── S3 Bucket — KYC Documents ─────────────────────────────
  KycDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "nexus-kyc-documents-${AWS::AccountId}"
      # Server-side encryption with KMS
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      # Block all public access — ID documents must never be public
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Processed documents deleted after 1 day
          - Id: DeleteProcessedDocuments
            Status: Enabled
            ExpirationInDays: 1
            TagFilters:
              - Key: ProcessingStatus
                Value: QUALITY_PASSED
          # Failed/rejected documents kept 7 days for debugging
          - Id: DeleteRejectedDocuments
            Status: Enabled
            ExpirationInDays: 7
            TagFilters:
              - Key: ProcessingStatus
                Value: QUALITY_REJECTED

  # ── SQS — Results Queue ───────────────────────────────────
  KycRekognitionResultsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: nexus-kyc-rekognition-results
      # 5 minutes: nexus-ai-kyc-service may take time to process
      VisibilityTimeout: 300
      # 1 hour: results consumed quickly; longer = KYC service down
      MessageRetentionPeriod: 3600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt KycResultsDLQ.Arn
        maxReceiveCount: 3

  KycResultsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: nexus-kyc-rekognition-results-dlq
      MessageRetentionPeriod: 86400   # 24 hours

  # ── CloudWatch Alarms ─────────────────────────────────────
  HighRejectionRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nexus-kyc-high-rejection-rate
      AlarmDescription: >
        More than 40% of KYC documents failing quality gates.
        May indicate user flow issue (wrong side photographed, etc.)
      Namespace: Nexus/KycRekognition
      MetricName: QualityGatePassed
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0.6
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching

  ResultsQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nexus-kyc-results-queue-depth
      AlarmDescription: >
        KYC results not being consumed. nexus-ai-kyc-service may be down.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt KycRekognitionResultsQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold

Outputs:
  LambdaArn:
    Value: !GetAtt KycRekognitionLambda.Arn
  KycBucketName:
    Value: !Ref KycDocumentsBucket
  ResultsQueueUrl:
    Value: !Ref KycRekognitionResultsQueue
  ResultsQueueArn:
    Value: !GetAtt KycRekognitionResultsQueue.Arn