spring:
  application:
    name: nexus-ai-assistant-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      # disabled: Brave's ThreadLocal trace context doesn't survive virtual
      # thread mount/unmount - controller-dispatched spans were silently
      # never exported to Zipkin (actuator/internal spans traced fine).
      enabled: false

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexus_ai_assistant}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:nexus_dev_password}
    hikari:
      # Fase 8: connection-timeout was missing — see account-service.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small # Asegúrate de que coincida con tus dimensiones 1536

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: mistral:7b
      embedding:
        enabled: false # Desactivamos para que no compita con OpenAI en los embeddings

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        # FORZAMOS el uso de OpenAI para el VectorStore para evitar el conflicto
        embedding-model-bean-name: openAiEmbeddingModel

server:
  port: 8090
  tomcat:
    threads:
      max: 50
    accept-count: 25

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

nexus:
  load-shedding:
    max-in-flight: 40
  services:
    account:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8085}
    transaction:
      url: ${TRANSACTION_SERVICE_URL:http://localhost:8086}
    fraud:
      url: ${FRAUD_SERVICE_URL:http://localhost:8087}

resilience4j:
  thread-pool-bulkhead:
    instances:
      # Isolated per dependency (Fase 3 principle) so a stuck account-service
      # call can't also starve capacity meant for transaction-service or
      # fraud-service calls. Sizing (Fase 4): estimado, no medido — latencia
      # típica ~5s peor caso (Fase 1), proyecto solo/portfolio, no se espera
      # sostener más de unos pocos chats concurrentes con tool-calls activos
      # a la vez. Ajustar con datos reales bajo carga.
      account-service-calls:
        core-thread-pool-size: 4
        max-thread-pool-size: 8
        queue-capacity: 4
        keep-alive-duration: 20s
      transaction-service-calls:
        core-thread-pool-size: 4
        max-thread-pool-size: 8
        queue-capacity: 4
        keep-alive-duration: 20s
      fraud-service-calls:
        core-thread-pool-size: 4
        max-thread-pool-size: 8
        queue-capacity: 4
        keep-alive-duration: 20s

  circuitbreaker:
    instances:
      ai-assistant-reads:
        # TIME_BASED, not COUNT_BASED: these tool-calls only fire when a
        # chat message actually triggers one — same low/bursty-traffic
        # reasoning as the gateway's ai-assistant-service breaker (Fase 3).
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      ai-assistant-reads:
        max-attempts: 2
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.net.ConnectException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,retries,threadpoolbulkheads
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.nexus.assistant: INFO
    org.springframework.ai: INFO