# ══════════════════════════════════════════════════════════════
# nexus-ai-assistant-service — DEV profile
# Active when: SPRING_PROFILES_ACTIVE=dev
#
# Prerequisites:
#   docker compose up -d nexus-postgres nexus-redis nexus-kafka \
#     nexus-config-service nexus-discovery-service nexus-ollama
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_ai_assistant
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 500ms

  kafka:
    bootstrap-servers: localhost:9092

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: mistral:7b

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always    # Auto-create schema in dev

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

nexus:
  services:
    account:
      url: http://localhost:8085
    transaction:
      url: http://localhost:8086
    fraud:
      url: http://localhost:8087

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.nexus.assistant: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.kafka: DEBUG
    reactor.netty: WARN
