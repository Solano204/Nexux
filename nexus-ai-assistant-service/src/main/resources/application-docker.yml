# ══════════════════════════════════════════════════════════════
# nexus-ai-assistant-service — DOCKER profile
# Active when: SPRING_PROFILES_ACTIVE=docker
# Set automatically by Dockerfile ENTRYPOINT: -Dspring.profiles.active=docker
#
# Purpose: Override all localhost addresses with Docker Compose
#          service names. This is the ONLY difference from dev.
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      uri: http://nexus-config-service:8888
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
    bus:
      enabled: true

  threads:
    virtual:
      enabled: true

  # ── PostgreSQL + pgvector ──────────────────────────────────
  # pgvector image required: pgvector/pgvector:pg16
  # Used for: chat_memory (JDBC), vector_store (pgvector semantic memory)
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_ai_assistant}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      pool-name: nexus-assistant-docker-pool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ── Redis ──────────────────────────────────────────────────
  data:
    redis:
      host: nexus-redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 100ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 5
          min-idle: 2
          max-wait: 100ms

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: nexus-kafka:9092
    producer:
      acks: "1"
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ── Spring AI ──────────────────────────────────────────────
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

    # Ollama: Docker service name (fallback when OpenAI is unavailable)
    ollama:
      base-url: http://nexus-ollama:11434
      chat:
        options:
          model: mistral:7b

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

server:
  port: 8090

# ── Eureka ─────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

# Internal service URLs — Docker Compose service names
nexus:
  services:
    account:
      url: http://nexus-account-service:8085
    transaction:
      url: http://nexus-transaction-service:8086
    fraud:
      url: http://nexus-fraud-service:8087

# ── Observability ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        ai.chat.response.duration: true
      percentiles:
        ai.chat.response.duration: 0.5, 0.9, 0.95, 0.99
    tags:
      application: nexus-ai-assistant-service
      environment: docker
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    com.nexus.assistant: INFO
    org.springframework.ai: INFO
    io.lettuce: WARN
    reactor.netty: WARN
