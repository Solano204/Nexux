# ══════════════════════════════════════════════════════════════════════
# nexus-ai-assistant-service — LOCAL DEVELOPMENT Docker Compose
# Profile: docker  (SPRING_PROFILES_ACTIVE=docker)
#
# Infrastructure (the most complex stack in the platform):
#   PostgreSQL 16 + pgvector  (port 5432)  — JDBC chat memory + RAG vectors
#   Redis 7                   (port 6379)  — session state per conversation
#   Kafka                     (port 9092)  — AI query event producer
#   Ollama                    (port 11434) — local LLM fallback (mistral:7b)
#   nexus-config-service      (port 8888)
#   nexus-discovery-service   (port 8761)
#   Zipkin, Prometheus, Loki, Grafana
#   nexus-ai-assistant-service (port 8090)
#
# IMPORTANT — Ollama model download:
#   Ollama starts with no models. The first request will fail until
#   mistral:7b is pulled. Pull it after first docker compose up:
#     docker exec nexus-ollama ollama pull mistral:7b
#   This is ~4GB download — do it once and it persists in the volume.
#   The scripts/pull-ollama-model.sh script automates this.
#
# IMPORTANT — OpenAI API key:
#   Set OPENAI_API_KEY in your shell or .env file BEFORE starting.
#   The service works without it (falls back to Ollama) but tool calling
#   quality degrades significantly with mistral:7b vs gpt-4o-mini.
#
# IMPORTANT — pgvector image:
#   Uses pgvector/pgvector:pg16 (NOT plain postgres:16).
#   The RAG financial knowledge base uses the vector extension.
#
# Ports exposed:
#   8090  — AI Assistant     (http://localhost:8090)
#   11434 — Ollama API       (http://localhost:11434)
#   5432  — PostgreSQL
#   6379  — Redis
#   9092  — Kafka
#   8888  — Config Service
#   8761  — Eureka
#   9411  — Zipkin           (http://localhost:9411)
#   3000  — Grafana          (http://localhost:3000  admin/admin)
#   9090  — Prometheus
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-ai-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  ollama-models:        # Persists downloaded Ollama models across restarts
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ────────────────────────────────────────────────────────────
  # POSTGRESQL + PGVECTOR
  # Used for:
  #   1. JDBC chat memory (spring.ai.chat.memory.repository.jdbc)
  #   2. pgvector RAG store (financial knowledge base embeddings)
  # ────────────────────────────────────────────────────────────
  nexus-postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus_ai_assistant
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_ai_assistant"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ────────────────────────────────────────────────────────────
  # REDIS — session state per conversation
  # Key pattern: ai:session:{userId}:{conversationId}
  # TTL: 30 min inactivity
  # ────────────────────────────────────────────────────────────
  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ────────────────────────────────────────────────────────────
  # KAFKA — AI query event producer (AiQueryEventProducer)
  # ────────────────────────────────────────────────────────────
  nexus-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    restart: unless-stopped
    depends_on:
      nexus-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://nexus-kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # OLLAMA — Local LLM fallback (mistral:7b)
  #
  # The service uses Ollama as fallback when OpenAI is unavailable.
  # Model is NOT pre-loaded — run after startup:
  #   docker exec nexus-ollama ollama pull mistral:7b
  # OR use the helper script:
  #   ./scripts/pull-ollama-model.sh
  #
  # Requires: ~4GB disk + 8GB RAM for mistral:7b inference
  # GPU: pass OLLAMA_GPU_LAYERS if you have an NVIDIA GPU
  # ────────────────────────────────────────────────────────────
  nexus-ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Uncomment if you have an NVIDIA GPU:
      # OLLAMA_GPU_LAYERS: "999"
      OLLAMA_KEEP_ALIVE: "30m"    # Keep model in memory 30 min after last use
      OLLAMA_MAX_LOADED_MODELS: 1
    networks:
      nexus-network:
        ipv4_address: 172.20.0.16
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # SPRING CLOUD INFRASTRUCTURE
  # ────────────────────────────────────────────────────────────
  nexus-config-service:
    image: nexusplatform/nexus-config-service:latest
    container_name: nexus-config-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nexus-discovery-service:
    image: nexusplatform/nexus-discovery-service:latest
    container_name: nexus-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    depends_on:
      nexus-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # OBSERVABILITY
  # ────────────────────────────────────────────────────────────
  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - nexus-network

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network

  nexus-promtail:
    image: grafana/promtail:2.9.3
    container_name: nexus-promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - nexus-network
    depends_on:
      - nexus-loki

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nexus-network
    depends_on:
      - nexus-prometheus
      - nexus-loki

  # ────────────────────────────────────────────────────────────
  # AI ASSISTANT SERVICE
  # ────────────────────────────────────────────────────────────
  nexus-ai-assistant-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-ai-assistant-service
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # PostgreSQL (also for pgvector + JDBC chat memory)
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_ai_assistant
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      # Redis
      REDIS_HOST: nexus-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      # Eureka
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      # AI providers
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: http://nexus-ollama:11434
      # Downstream service URLs (tool calling)
      ACCOUNT_SERVICE_URL: http://nexus-account-service:8085
      TRANSACTION_SERVICE_URL: http://nexus-transaction-service:8086
      FRAUD_SERVICE_URL: http://nexus-fraud-service:8087
      # Observability
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: "1.0"
      ENVIRONMENT: local-docker
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-kafka:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
      nexus-ollama:
        condition: service_healthy
      nexus-zipkin:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.36
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 120s
