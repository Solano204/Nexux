spring:
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://nexus-config-service:8888}
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
    bus:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:nexus-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 100ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}

nexus:
  gateway:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://nexus-identity-service:8083/api/v1/auth/.well-known/jwks.json}
      cognito:
        user-pool-id: ${COGNITO_USER_POOL_ID:}
        region: ${COGNITO_REGION:us-east-1}
        client-id: ${COGNITO_CLIENT_ID:}
    global-rate-limit:
      enabled: true
      requests-per-second: 5000
    security:
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.nexusbank.com}

management:
  tracing:
    enabled: true
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: WARN
    com.nexus.gateway: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
    io.github.resilience4j: WARN
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
