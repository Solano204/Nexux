spring:
  application:
    name: nexus-api-gateway

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 10
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.5
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

    bus:
      enabled: true

    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - X-Request-Id
              - X-Idempotency-Key
            allow-credentials: true
            max-age: 3600

      default-filters:
        - AddResponseHeader=X-Gateway-Version, 1.0.0
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-XSS-Protection, 1; mode=block
        - AddResponseHeader=Referrer-Policy, no-referrer
        - DedupeResponseHeader=Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_UNIQUE

      routes:

        - id: nexus-identity-service-public
          uri: lb://nexus-identity-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 50
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: identity-service
                fallbackUri: forward:/fallback/identity
            - name: Retry
              args:
                retries: 2
                statuses: SERVICE_UNAVAILABLE,BAD_GATEWAY
                methods: GET,POST,PUT
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
            - AddRequestHeader=X-Gateway-Version, 1.0.0
            - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/auth/$\{segment}
            - name: RequestSize
              args:
                maxSize: 512KB

        - id: nexus-account-service
          uri: lb://nexus-account-service
          predicates:
            - Path=/api/v1/accounts/**
          metadata:
            response-timeout: 120000
            connect-timeout: 5000
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: account-service
                fallbackUri: forward:/fallback/account
            - name: Retry
              args:
                retries: 1
                statuses: SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: nexus-transaction-service
          uri: lb://nexus-transaction-service
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: transaction-service
                fallbackUri: forward:/fallback/transaction
            - name: RequestSize
              args:
                maxSize: 10KB

        - id: nexus-ai-assistant-service
          uri: lb://nexus-ai-assistant-service
          predicates:
            - Path=/api/v1/ai/**
          metadata:
            response-timeout: 120000
            connect-timeout: 5000
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: ai-assistant-service
                fallbackUri: forward:/fallback/ai-assistant

        - id: nexus-identity-service-users
          uri: lb://nexus-identity-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: identity-service
                fallbackUri: forward:/fallback/identity
            - name: RequestSize
              args:
                maxSize: 10MB

        - id: nexus-identity-service-internal
          uri: lb://nexus-identity-service
          predicates:
            - Path=/internal/v1/users/**,/internal/v1/health/**
            - RemoteAddr=172.20.0.0/16
          filters:
            - name: CircuitBreaker
              args:
                name: identity-service
                fallbackUri: forward:/fallback/identity

        - id: nexus-fraud-service-internal
          uri: lb://nexus-fraud-service
          predicates:
            - Path=/internal/v1/fraud/**
            - RemoteAddr=172.20.0.0/16
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: fraud-service
                fallbackUri: forward:/fallback/fraud
            - name: RequestSize
              args:
                maxSize: 50KB

        - id: nexus-notification-service-internal
          uri: lb://nexus-notification-service
          predicates:
            - Path=/internal/v1/notifications/**
            - RemoteAddr=172.20.0.0/16
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: notification-service
                fallbackUri: forward:/fallback/generic

        - id: nexus-ledger-service
          uri: lb://nexus-ledger-service
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: ledger-service
                fallbackUri: forward:/fallback/ledger

        - id: nexus-analytics-service
          uri: lb://nexus-analytics-service
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: analytics-service
                fallbackUri: forward:/fallback/analytics

        - id: actuator-internal
          uri: http://localhost:8080
          predicates:
            - Path=/actuator/**
            - RemoteAddr=127.0.0.1,172.20.0.0/16
          filters: []

        - id: webhooks-payment
          uri: lb://nexus-transaction-service
          predicates:
            - Path=/api/v1/webhooks/**
          filters:
            - name: WebhookHmac
            - name: CircuitBreaker
              args:
                name: webhook-handler
                fallbackUri: forward:/fallback/webhook
            - name: RequestSize
              args:
                maxSize: 100KB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms
      connect-timeout: 500ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          max-wait: 100ms
        shutdown-timeout: 200ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: nexus-api-gateway-bus
      auto-offset-reset: latest

server:
  port: 8080
  netty:
    connection-timeout: 5s
    h2c-max-content-length: 0
    idle-timeout: 60s
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 30
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - java.io.IOException
          - org.springframework.web.server.ResponseStatusException

    instances:
      transaction-service:
        base-config: default
        sliding-window-size: 50
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 30s
      account-service:
        base-config: default
        failure-rate-threshold: 50
        slow-call-duration-threshold: 120000ms
      identity-service:
        base-config: default
        failure-rate-threshold: 60
        slow-call-duration-threshold: 3000ms
      ai-assistant-service:
        base-config: default
        failure-rate-threshold: 60
        slow-call-duration-threshold: 30000ms
        wait-duration-in-open-state: 60s
      fraud-service:
        base-config: default
        failure-rate-threshold: 50
        slow-call-duration-threshold: 30000ms
      ledger-service:
        base-config: default
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
      analytics-service:
        base-config: default
        failure-rate-threshold: 70
        slow-call-duration-threshold: 5000ms
      notification-service:
        base-config: default
        failure-rate-threshold: 70
      webhook-handler:
        base-config: default
        failure-rate-threshold: 60

  bulkhead:
    instances:
      transaction-service:
        max-concurrent-calls: 50
        max-wait-duration: 0
      account-service:
        max-concurrent-calls: 50
      ai-assistant-service:
        max-concurrent-calls: 20
        max-wait-duration: 0
      fraud-service:
        max-concurrent-calls: 30
      default:
        max-concurrent-calls: 30

  timelimiter:
    instances:
      transaction-service:
        timeout-duration: 10s
        cancel-running-future: true
      account-service:
        timeout-duration: 120s
        cancel-running-future: false
      ai-assistant-service:
        timeout-duration: 120s
        cancel-running-future: false
      default:
        timeout-duration: 10s
        cancel-running-future: true

nexus:
  gateway:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8083/api/v1/auth/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:nexus-platform}
      audience: nexus-platform
      algorithms:
        - RS256
      refresh-interval-minutes: 60
      blacklist:
        redis-key-prefix: "jwt:blacklist:"
        check-timeout-ms: 100
      keyring:
        pubsub-channel: "jwt:keyrotation"
    global-rate-limit:
      enabled: true
      requests-per-second: 5000
    security:
      hsts-max-age: 31536000
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    internal-network: 172.20.0.0/16

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
          - circuitbreakers
          - ratelimiters
          - bulkheads
          - loggers
          - busrefresh
          - gateway
  endpoint:
    health:
      show-details: always
      show-components: always
    gateway:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        spring.cloud.gateway.requests: true
        http.server.requests: true
      percentiles:
        spring.cloud.gateway.requests: 0.5,0.9,0.95,0.99
        http.server.requests: 0.5,0.9,0.95,0.99
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9412/api/v2/spans}

logging:
  level:
    com.nexus.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: WARN
    io.github.resilience4j: INFO
