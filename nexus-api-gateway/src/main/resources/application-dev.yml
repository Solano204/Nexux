# ══════════════════════════════════════════════════════════════
# nexus-api-gateway — DEV profile
# Active when: SPRING_PROFILES_ACTIVE=dev  (local IDE/mvn run)
# Purpose: override Docker-centric defaults for local development
# WITHOUT Docker Compose. Services called directly on localhost.
# ══════════════════════════════════════════════════════════════

spring:
  # Disable Cloud Config fetching in dev — use local application.yml
  cloud:
    config:
      enabled: false
      fail-fast: false

    # Disable Cloud Bus (no Kafka needed in dev)
    bus:
      enabled: false

    gateway:
      # Dev route overrides: point to localhost ports
      # (same ports as Docker Compose but reachable without Docker network)
      routes:
        - id: nexus-identity-service-public
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100  # Very lenient in dev
                redis-rate-limiter.burstCapacity: 1000
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: identity-service
                fallbackUri: forward:/fallback/identity

        - id: nexus-account-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: account-service
                fallbackUri: forward:/fallback/account

        - id: nexus-transaction-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: transaction-service
                fallbackUri: forward:/fallback/transaction

        - id: nexus-ai-assistant-service
          uri: http://localhost:8090
          predicates:
            - Path=/ai/**
          filters:
            - name: JwtAuthentication
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: ai-assistant-service
                fallbackUri: forward:/fallback/ai-assistant

        - id: nexus-fraud-service-internal
          uri: http://localhost:8087
          predicates:
            - Path=/internal/v1/fraud/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: fraud-service
                fallbackUri: forward:/fallback/fraud

        - id: nexus-ledger-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: ledger-service
                fallbackUri: forward:/fallback/ledger

        - id: nexus-analytics-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: analytics-service
                fallbackUri: forward:/fallback/analytics

        - id: nexus-risk-scoring-service
          uri: http://localhost:8094
          predicates:
            - Path=/api/v1/risk/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: risk-scoring-service
                fallbackUri: forward:/fallback/generic

        - id: nexus-ai-kyc-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/kyc/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: ai-kyc-service
                fallbackUri: forward:/fallback/generic

        - id: actuator-internal
          uri: http://localhost:8080
          predicates:
            - Path=/actuator/**
          filters: []

  # Redis: use local Redis (same as Docker, assume redis-cli available)
  data:
    redis:
      host: localhost
      port: 6379
      password: ""   # No password in dev
      timeout: 500ms

  # Kafka: local broker
  kafka:
    bootstrap-servers: localhost:9092

# Eureka: use local discovery service
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# JWT: JWKS from local identity service
nexus:
  gateway:
    jwt:
      jwks-uri: http://localhost:8083/api/v1/auth/.well-known/jwks.json
      issuer: nexus-platform
    global-rate-limit:
      requests-per-second: 100000  # Effectively disabled in dev
      enabled: false               # No global limit in dev
    security:
      cors:
        allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:8080"

# Resilience4j: very lenient in dev (don't want CB opening during debugging)
resilience4j:
  circuitbreaker:
    configs:
      default:
        minimum-number-of-calls: 100         # Need 100 failures before opening
        failure-rate-threshold: 90           # 90% failure rate to open
        wait-duration-in-open-state: 10s     # Only wait 10s in dev
  timelimiter:
    instances:
      default:
        timeout-duration: 60s                # Long timeout in dev (debugging)
      ai-assistant-service:
        timeout-duration: 300s               # 5 min for LLM in dev

# Observability: full tracing in dev, Zipkin optional
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # Trace everything in dev
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.nexus.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    io.github.resilience4j: DEBUG
    io.lettuce: DEBUG