# ══════════════════════════════════════════════════════════════
# nexus-api-gateway — DOCKER profile
# Active when: SPRING_PROFILES_ACTIVE=docker
# Set automatically by Dockerfile ENTRYPOINT: -Dspring.profiles.active=docker
# Purpose: Docker Compose service names as hostnames,
#          production-grade timeouts, full observability stack.
# ══════════════════════════════════════════════════════════════

spring:
  # Cloud Config: fetch all config from Config Service container
  cloud:
    config:
      uri: http://nexus-config-service:8888
      enabled: true
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 2000    # 2s initial wait
        max-interval: 10000       # 10s max wait
        multiplier: 1.5

    # Cloud Bus: config refresh via Kafka
    bus:
      enabled: true

    gateway:
      # All routes use Docker service names for URI
      # (defined in application.yml base config — inheriting here)
      # This profile adds Docker-specific filter configs

      default-filters:
        - AddResponseHeader=X-Gateway-Version, 1.0.0
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-XSS-Protection, 1; mode=block
        - AddResponseHeader=Referrer-Policy, no-referrer
        - RemoveRequestHeader=X-User-Id
        - RemoveRequestHeader=X-User-Roles
        - RemoveRequestHeader=X-Gateway-Internal
        - DedupeResponseHeader=Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_UNIQUE

  # Redis: Docker Compose service name
  data:
    redis:
      host: nexus-redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 100ms
      connect-timeout: 500ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          max-wait: 100ms
        shutdown-timeout: 200ms

  # Kafka: Docker Compose service name
  kafka:
    bootstrap-servers: nexus-kafka:9092
    consumer:
      group-id: nexus-api-gateway-bus
      auto-offset-reset: latest

# Eureka: Docker Compose service name
eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    registry-fetch-interval-seconds: 30
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

# JWT: Identity Service Docker hostname
nexus:
  gateway:
    jwt:
      jwks-uri: http://nexus-identity-service:8083/api/v1/auth/.well-known/jwks.json
      issuer: nexus-platform
      audience: nexus-platform
      refresh-interval-minutes: 60
      blacklist:
        redis-key-prefix: "jwt:blacklist:"
        check-timeout-ms: 100
      keyring:
        pubsub-channel: "jwt:keyrotation"

    global-rate-limit:
      enabled: true
      requests-per-second: 5000

    security:
      hsts-max-age: 31536000
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

    internal-network: 172.20.0.0/16

    # Webhook HMAC secret (injected from Docker Compose env)
    webhook:
      hmac-secret: ${WEBHOOK_HMAC_SECRET:dev-secret-change-in-prod}

# Resilience4j: production settings (same as application.yml base)
# Circuit breakers tuned for real network latencies inside Docker
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      transaction-service:
        timeout-duration: 10s
        cancel-running-future: true
      ai-assistant-service:
        timeout-duration: 120s
        cancel-running-future: false
      default:
        timeout-duration: 10s
        cancel-running-future: true

# Observability: Zipkin + Prometheus inside Docker network
management:
  endpoints:
    web:
      exposure:
        include: >
          health,info,prometheus,metrics,circuitbreakers,
          ratelimiters,bulkheads,loggers,busrefresh,gateway
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        spring.cloud.gateway.requests: true
        http.server.requests: true
      percentiles:
        spring.cloud.gateway.requests: 0.5, 0.9, 0.95, 0.99
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: nexus-api-gateway
      environment: docker
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    com.nexus.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: WARN
    io.github.resilience4j: INFO
    reactor.netty: WARN
    io.lettuce: WARN
    com.netflix.eureka: WARN