# ══════════════════════════════════════════════════════════════
# nexus-api-gateway — TEST profile
# Used by: all @SpringBootTest integration and contract tests
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      enabled: false
      fail-fast: false
    bus:
      enabled: false
    gateway:
      # Test routes point to WireMock / localhost
      # Overridden per test via @DynamicPropertySource
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            # application.yml's base config sets allow-credentials: true,
            # which is invalid combined with a wildcard allowed-origins
            # (Spring's CorsConfiguration.validateAllowCredentials() throws
            # IllegalArgumentException at request time - not at startup -
            # for any request carrying an Origin header). Tests don't need
            # credentialed CORS, so turn it off here instead of pinning
            # test requests to specific origins.
            allow-credentials: false

  data:
    redis:
      # Overridden by @DynamicPropertySource with Testcontainers port
      host: localhost
      port: 6379
      password: ""
      timeout: 1000ms

  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

nexus:
  gateway:
    jwt:
      jwks-uri: http://localhost:9999/.well-known/jwks.json
      issuer: nexus-platform
      audience: nexus-platform
      refresh-interval-minutes: 60
      blacklist:
        redis-key-prefix: "jwt:blacklist:"
        check-timeout-ms: 500   # Generous timeout in tests
    global-rate-limit:
      enabled: false            # Disabled in tests
      requests-per-second: 100000
    security:
      cors:
        allowed-origins: "*"
    webhook:
      hmac-secret: test-hmac-secret-for-tests-only

# Resilience4j: very lenient in tests
resilience4j:
  circuitbreaker:
    configs:
      default:
        minimum-number-of-calls: 1000      # Almost never opens in tests
        failure-rate-threshold: 99
        wait-duration-in-open-state: 1s
  timelimiter:
    instances:
      default:
        timeout-duration: 30s
      ai-assistant-service:
        timeout-duration: 30s

management:
  tracing:
    enabled: false    # No Zipkin in tests
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  health:
    # The Spring Cloud Stream Kafka binder's health indicator actively
    # checks broker connectivity (up to 60s per LEADER_NOT_AVAILABLE /
    # metadata timeout) and is included in the aggregate /actuator/health
    # status - no test here provisions a real Kafka broker, so any test
    # that actually calls /actuator/health hangs waiting on it.
    binders:
      enabled: false

logging:
  level:
    com.nexus.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    io.github.resilience4j: WARN