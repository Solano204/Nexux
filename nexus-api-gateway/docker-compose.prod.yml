# ══════════════════════════════════════════════════════════════════════
# nexus-api-gateway — PRODUCTION Docker Compose
# Profile: docker  (SPRING_PROFILES_ACTIVE=docker)
#
# Differences from local compose:
#   - No ports exposed except 8080 (put behind a reverse proxy/LB)
#   - Secrets injected from environment variables, NOT hardcoded defaults
#   - Health check start_period extended (cold start is slower in prod)
#   - logging driver: json-file with rotation limits
#   - Restart policy: always (not unless-stopped)
#   - Resource limits on every container
#   - No build: — images must already exist in your registry
#
# Usage:
#   export REDIS_PASSWORD=<secret>
#   export KAFKA_BOOTSTRAP_SERVERS=<broker1:9092,broker2:9092>
#   export WEBHOOK_HMAC_SECRET=<secret>
#   export DOCKER_HUB_USERNAME=nexusplatform
#   docker compose -f docker-compose.prod.yml up -d
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data-prod:
  prometheus-data-prod:
  grafana-data-prod:
  loki-data-prod:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:

  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 100
      --appendonly yes
    volumes:
      - redis-data-prod:/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nexus-config-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-config-service:${IMAGE_TAG:-latest}
    container_name: nexus-config-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nexus-discovery-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-discovery-service:${IMAGE_TAG:-latest}
    container_name: nexus-discovery-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    depends_on:
      nexus-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: always
    # No port exposure in prod — access via Grafana dashboard
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: always
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data-prod:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: always
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data-prod:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: always
    ports:
      - "3000:3000"   # Expose Grafana — put behind nginx/TLS in real prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-prod:/var/lib/grafana
    networks:
      - nexus-network
    logging: *default-logging
    depends_on:
      - nexus-prometheus
      - nexus-loki

  nexus-api-gateway:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-api-gateway:${IMAGE_TAG:-latest}
    container_name: nexus-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Redis — no default, must be set in environment
      REDIS_HOST: nexus-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Kafka — external broker in prod
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexus-kafka:9092}
      # Eureka
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      # JWT
      JWT_JWKS_URI: ${JWT_JWKS_URI:-http://nexus-identity-service:8083/api/v1/auth/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-nexus-platform}
      # Observability
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      ENVIRONMENT: production
      # CORS — only your real frontend origins
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Webhook — must be set, no fallback
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET}
    depends_on:
      nexus-redis:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.30
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
