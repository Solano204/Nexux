spring:
  application:
    name: nexus-api-gateway

  # ══════════════════════════════════════════════════════════════
  # SPRING CLOUD CONFIG — Load all config from Config Service
  # fail-fast: true — gateway refuses to start without config
  # ══════════════════════════════════════════════════════════════
  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: http://nexus-config-service:8888
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.5

    # ════════════════════════════════════════════════════════════
    # SPRING CLOUD BUS — Config refresh broadcast via Kafka
    # POST /actuator/busrefresh broadcasts to ALL instances
    # ════════════════════════════════════════════════════════════
    bus:
      enabled: true

    # ════════════════════════════════════════════════════════════
    # GATEWAY ROUTES — Complete routing table
    # All 10 routes from the architecture documentation
    # ════════════════════════════════════════════════════════════
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - X-Request-Id
              - X-Idempotency-Key
            allow-credentials: true
            max-age: 3600

      # Default filters applied to ALL routes
      default-filters:
        - AddResponseHeader=X-Gateway-Version, 1.0.0
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-XSS-Protection, 1; mode=block
        - AddResponseHeader=Referrer-Policy, no-referrer
        - RemoveRequestHeader=X-User-Id
        - RemoveRequestHeader=X-User-Roles
        - RemoveRequestHeader=X-Gateway-Internal
        - DedupeResponseHeader=Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_UNIQUE

      routes:

        # ──────────────────────────────────────────────────────
        # ROUTE 1: Identity Service — Public (no JWT required)
        # Login, register, token refresh endpoints
        # ──────────────────────────────────────────────────────
        - id: nexus-identity-service-public
          uri: lb://nexus-identity-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: identity-service
                fallbackUri: forward:/fallback/identity
            - AddRequestHeader=X-Gateway-Version, 1.0.0
            - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/auth/$\{segment}
            - name: RequestSize
              args:
                maxSize: 512KB

        # ──────────────────────────────────────────────────────
        # ROUTE 2: Account Service — Authenticated
        # ──────────────────────────────────────────────────────
        - id: nexus-account-service
          uri: lb://nexus-account-service
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: account-service
                fallbackUri: forward:/fallback/account
            - name: Retry
              args:
                retries: 1
                statuses: SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        # ──────────────────────────────────────────────────────
        # ROUTE 3: Transaction Service — Authenticated, strictest limits
        # Financial operations — most conservative config
        # ──────────────────────────────────────────────────────
        - id: nexus-transaction-service
          uri: lb://nexus-transaction-service
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: transaction-service
                fallbackUri: forward:/fallback/transaction
            - name: RequestSize
              args:
                maxSize: 10KB
            - AddRequestHeader=X-Forwarded-For, ${request.remoteAddr}

        # ──────────────────────────────────────────────────────
        # ROUTE 4: AI Assistant Service — Authenticated, streaming
        # SSE streaming support — NO response buffering
        # Per-hour rate limit (AI calls are expensive)
        # ──────────────────────────────────────────────────────
        - id: nexus-ai-assistant-service
          uri: lb://nexus-ai-assistant-service
          predicates:
            - Path=/ai/**
          filters:
            - name: JwtAuthentication
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 0
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: ai-assistant-service
                fallbackUri: forward:/fallback/ai-assistant

        # ──────────────────────────────────────────────────────
        # ROUTE 5: Fraud Service — Internal only (IP allowlist)
        # Not accessible from outside Docker network
        # ──────────────────────────────────────────────────────
        - id: nexus-fraud-service-internal
          uri: lb://nexus-fraud-service
          predicates:
            - Path=/internal/v1/fraud/**
            - RemoteAddr=172.20.0.0/16
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: fraud-service
                fallbackUri: forward:/fallback/fraud
            - name: RequestSize
              args:
                maxSize: 50KB

        # ──────────────────────────────────────────────────────
        # ROUTE 6: Notification Service — Internal only
        # ──────────────────────────────────────────────────────
        - id: nexus-notification-service-internal
          uri: lb://nexus-notification-service
          predicates:
            - Path=/internal/v1/notifications/**
            - RemoteAddr=172.20.0.0/16
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: notification-service
                fallbackUri: forward:/fallback/generic

        # ──────────────────────────────────────────────────────
        # ROUTE 7: Ledger Service — Authenticated, cacheable reads
        # ──────────────────────────────────────────────────────
        - id: nexus-ledger-service
          uri: lb://nexus-ledger-service
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: ledger-service
                fallbackUri: forward:/fallback/ledger
            - name: LocalResponseCache
              args:
                size: 1000
                timeToLive: 5m

        # ──────────────────────────────────────────────────────
        # ROUTE 8: Analytics Service — Authenticated, cacheable
        # ──────────────────────────────────────────────────────
        - id: nexus-analytics-service
          uri: lb://nexus-analytics-service
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userIdKeyResolver}"
            - name: CircuitBreaker
              args:
                name: analytics-service
                fallbackUri: forward:/fallback/analytics
            - name: LocalResponseCache
              args:
                size: 500
                timeToLive: 1m

        # ──────────────────────────────────────────────────────
        # ROUTE 9: Actuator — Internal monitoring only
        # Prometheus scrapes this. Never exposed externally.
        # ──────────────────────────────────────────────────────
        - id: actuator-internal
          uri: http://localhost:8080
          predicates:
            - Path=/actuator/**
            - RemoteAddr=127.0.0.1, 172.20.0.0/16
          filters: []

        # ──────────────────────────────────────────────────────
        # ROUTE 10: Webhook endpoints — HMAC authentication
        # Payment network callbacks from AWS plane
        # ──────────────────────────────────────────────────────
        - id: webhooks-payment
          uri: lb://nexus-transaction-service
          predicates:
            - Path=/api/v1/webhooks/**
          filters:
            - name: WebhookHmac
            - name: CircuitBreaker
              args:
                name: webhook-handler
                fallbackUri: forward:/fallback/webhook
            - name: RequestSize
              args:
                maxSize: 100KB

  # ════════════════════════════════════════════════════════════
  # REDIS — Rate limiting + JWT blacklist
  # ════════════════════════════════════════════════════════════
  data:
    redis:
      host: ${REDIS_HOST:nexus-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms
      connect-timeout: 500ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          max-wait: 100ms
        shutdown-timeout: 200ms

  # ════════════════════════════════════════════════════════════
  # KAFKA — Spring Cloud Bus for config refresh broadcast
  # ════════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
    consumer:
      group-id: nexus-api-gateway-bus
      auto-offset-reset: latest

# ══════════════════════════════════════════════════════════════
# SERVER — Netty configuration
# ══════════════════════════════════════════════════════════════
server:
  port: 8080
  netty:
    connection-timeout: 5s
    h2c-max-content-length: 0  # Disable HTTP/2 max content for streaming
    idle-timeout: 60s
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

# ══════════════════════════════════════════════════════════════
# EUREKA — Service discovery client
# ══════════════════════════════════════════════════════════════
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
    registry-fetch-interval-seconds: 30
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

# ══════════════════════════════════════════════════════════════
# RESILIENCE4J — Circuit Breakers per downstream service
# Full configuration as per architecture documentation
# ══════════════════════════════════════════════════════════════
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - java.io.IOException
          - org.springframework.web.server.ResponseStatusException

    instances:
      # Transaction service — most conservative (financial critical)
      transaction-service:
        base-config: default
        sliding-window-size: 50
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 30s

      # Account service — conservative
      account-service:
        base-config: default
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2000ms

      # Identity service — moderate
      identity-service:
        base-config: default
        failure-rate-threshold: 60
        slow-call-duration-threshold: 3000ms

      # AI assistant — lenient (LLM calls are slow by nature)
      ai-assistant-service:
        base-config: default
        failure-rate-threshold: 60
        slow-call-duration-threshold: 30000ms
        wait-duration-in-open-state: 60s

      # Fraud service — moderate
      fraud-service:
        base-config: default
        failure-rate-threshold: 50
        slow-call-duration-threshold: 30000ms

      # Ledger service
      ledger-service:
        base-config: default
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2000ms

      # Analytics — less critical
      analytics-service:
        base-config: default
        failure-rate-threshold: 70
        slow-call-duration-threshold: 5000ms

      # Notification — less critical
      notification-service:
        base-config: default
        failure-rate-threshold: 70

      # Generic webhook handler
      webhook-handler:
        base-config: default
        failure-rate-threshold: 60

  bulkhead:
    instances:
      transaction-service:
        max-concurrent-calls: 50
        max-wait-duration: 0
      account-service:
        max-concurrent-calls: 50
      ai-assistant-service:
        max-concurrent-calls: 20
        max-wait-duration: 0
      fraud-service:
        max-concurrent-calls: 30
      default:
        max-concurrent-calls: 30

  timelimiter:
    instances:
      transaction-service:
        timeout-duration: 10s
        cancel-running-future: true
      ai-assistant-service:
        timeout-duration: 120s
        cancel-running-future: false  # Don't cancel streaming
      default:
        timeout-duration: 10s
        cancel-running-future: true

# ══════════════════════════════════════════════════════════════
# JWT CONFIGURATION
# ══════════════════════════════════════════════════════════════
nexus:
  gateway:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://nexus-identity-service:8083/api/v1/auth/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:nexus-platform}
      audience: nexus-platform
      algorithms:
        - RS256
      refresh-interval-minutes: 60
      blacklist:
        redis-key-prefix: "jwt:blacklist:"
        check-timeout-ms: 100
      keyring:
        pubsub-channel: "jwt:keyrotation"

    # Global rate limit (DDoS protection)
    global-rate-limit:
      enabled: true
      requests-per-second: 5000

    # Security headers
    security:
      hsts-max-age: 31536000
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

    # Internal Docker network CIDR
    internal-network: 172.20.0.0/16

# ══════════════════════════════════════════════════════════════
# OBSERVABILITY — Prometheus + Zipkin
# ══════════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,
          ratelimiters,bulkheads,loggers,busrefresh,gateway
  endpoint:
    health:
      show-details: always
      show-components: always
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        spring.cloud.gateway.requests: true
        http.server.requests: true
      percentiles:
        spring.cloud.gateway.requests: 0.5, 0.9, 0.95, 0.99
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    com.nexus.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: WARN
    io.github.resilience4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level traceId=%X{traceId} spanId=%X{spanId} service=nexus-api-gateway %logger{36} - %msg%n"