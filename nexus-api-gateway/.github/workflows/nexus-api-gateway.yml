# .github/workflows/nexus-api-gateway.yml
# RENAMED from nexus-api-gateway.api — GitHub Actions only picks up .yml files

name: Nexus API Gateway Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'nexus-api-gateway/**'
      - '.github/workflows/nexus-api-gateway.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'nexus-api-gateway/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: nexus-api-gateway
  JAVA_VERSION: '25'
  DOCKER_IMAGE: nexusplatform/nexus-api-gateway

jobs:

  # ════════════════════════════════════════════════════════════
  # STAGE 1: COMPILE + UNIT TESTS
  # ════════════════════════════════════════════════════════════
  unit-tests:
    name: Compile + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn compile -q --no-transfer-progress

      - name: Run Unit Tests
        run: |
          mvn test \
            -Dgroups="unit" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            --no-transfer-progress

      - name: Generate Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests — ${{ env.SERVICE_NAME }}
          path: nexus-api-gateway/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Verify Coverage
        run: |
          mvn verify \
            -Dgroups="unit" \
            -Pcoverage \
            --no-transfer-progress

      - name: Cache compiled classes
        uses: actions/cache/save@v4
        with:
          path: nexus-api-gateway/target
          key: compiled-gateway-${{ github.sha }}

  # ════════════════════════════════════════════════════════════
  # STAGE 2: INTEGRATION TESTS (Testcontainers)
  # ════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Restore compiled artifacts
        uses: actions/cache/restore@v4
        with:
          path: nexus-api-gateway/target
          key: compiled-gateway-${{ github.sha }}

      - name: Run Integration Tests
        run: |
          mvn test \
            -Dgroups="integration" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            --no-transfer-progress
        env:
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Generate Integration Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Tests — ${{ env.SERVICE_NAME }}
          path: nexus-api-gateway/target/surefire-reports/*.xml
          reporter: java-junit

  # ════════════════════════════════════════════════════════════
  # STAGE 3: CONTRACT TESTS
  # ════════════════════════════════════════════════════════════
  contract-tests:
    name: Contract Tests
    needs: integration-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Contract Tests
        run: |
          mvn test \
            -Dgroups="contract" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            --no-transfer-progress

  # ════════════════════════════════════════════════════════════
  # STAGE 4: DOCKER BUILD + PUSH
  # Only on main / develop after all tests pass
  # ════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build + Push
    needs: [unit-tests, integration-tests, contract-tests]
    if: |
      always() && !failure() && !cancelled() &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: nexus-api-gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════
  # STAGE 5: DEPLOY TO STAGING
  # ════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy nexus-api-gateway to staging
        run: |
          echo "Deploying nexus-api-gateway:${{ github.sha }} to staging"
          # kubectl set image deployment/nexus-api-gateway \
          #   nexus-api-gateway=${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          # kubectl rollout status deployment/nexus-api-gateway --timeout=120s
