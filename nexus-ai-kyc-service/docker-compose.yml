# ══════════════════════════════════════════════════════════════════════
# nexus-ai-kyc-service — LOCAL DEVELOPMENT Docker Compose
# Profile: docker  (SPRING_PROFILES_ACTIVE=docker)
#
# Infrastructure:
#   PostgreSQL 16       (port 5432)  — immutable KYC audit trail
#   MongoDB 7           (port 27017) — KYC documents + GridFS (encrypted binaries)
#   Kafka + Zookeeper   (port 9092)  — identity.kyc.events + saga.replies producer
#   LocalStack          (port 4566)  — AWS S3 (documents) + KMS (optional)
#   nexus-config-service  (port 8888)
#   nexus-discovery-service (port 8761)
#   Zipkin, Prometheus, Loki, Grafana
#   nexus-ai-kyc-service  (port 8091)
#
# NOTE: Plain postgres:16 — no pgvector needed here (no AI embeddings).
#
# KYC PIPELINE:
#   1. Document uploaded to S3 by nexus-identity-service
#   2. This service retrieves doc from S3, stores encrypted in GridFS
#   3. Stage 1: GPT-4o Vision extracts KycExtractedData (gpt-4o — expensive!)
#   4. Stage 2: GPT-4o-mini compares extracted vs submitted data
#   5. Publishes KycVerificationDecision to identity.kyc.events + saga.replies
#
# COSTS:
#   GPT-4o Vision is significantly more expensive than gpt-4o-mini.
#   Each Stage 1 call processes a full document image (≤10MB).
#   In dev: use low-resolution test images to control costs.
#   Set OPENAI_API_KEY before starting.
#
# S3 SETUP (LocalStack):
#   scripts/localstack-init.sh runs automatically on container start.
#   Creates the nexus-kyc-documents bucket.
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-kyc-data:
  mongodb-kyc-data:
  kafka-data:
  zookeeper-data:
  localstack-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ────────────────────────────────────────────────────────────
  # POSTGRESQL — immutable KYC audit trail (append-only)
  # Plain postgres:16 — no pgvector needed for this service
  # ────────────────────────────────────────────────────────────
  nexus-postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus_kyc
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-kyc-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_kyc"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ────────────────────────────────────────────────────────────
  # MONGODB — KYC documents + GridFS
  # Collections:
  #   kyc_documents         — KycDocumentMongoDB entities
  #   fs.files / fs.chunks  — GridFS encrypted document binaries
  # ────────────────────────────────────────────────────────────
  nexus-mongodb:
    image: mongo:7.0
    container_name: nexus-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: nexus_dev_password
      MONGO_INITDB_DATABASE: nexus_kyc
    ports:
      - "27017:27017"
    volumes:
      - mongodb-kyc-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.6
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ────────────────────────────────────────────────────────────
  # KAFKA — KYC event producer (NOT a consumer)
  # Produces to: identity.kyc.events, saga.replies
  # ────────────────────────────────────────────────────────────
  nexus-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    restart: unless-stopped
    depends_on:
      nexus-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://nexus-kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # LOCALSTACK — AWS S3 emulation (document storage)
  # The identity service uploads documents to S3 before calling KYC.
  # This service retrieves them from S3 for AI processing.
  # ────────────────────────────────────────────────────────────
  nexus-localstack:
    image: localstack/localstack:3.2
    container_name: nexus-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.15
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ────────────────────────────────────────────────────────────
  # SPRING CLOUD INFRASTRUCTURE
  # ────────────────────────────────────────────────────────────
  nexus-config-service:
    image: nexusplatform/nexus-config-service:latest
    container_name: nexus-config-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nexus-discovery-service:
    image: nexusplatform/nexus-discovery-service:latest
    container_name: nexus-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    depends_on:
      nexus-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # OBSERVABILITY
  # ────────────────────────────────────────────────────────────
  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - nexus-network

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network

  nexus-promtail:
    image: grafana/promtail:2.9.3
    container_name: nexus-promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - nexus-network
    depends_on:
      - nexus-loki

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nexus-network
    depends_on:
      - nexus-prometheus
      - nexus-loki

  # ────────────────────────────────────────────────────────────
  # KYC SERVICE
  # ────────────────────────────────────────────────────────────
  nexus-ai-kyc-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-ai-kyc-service
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # PostgreSQL
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_kyc
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      # MongoDB
      MONGODB_URI: mongodb://nexus:nexus_dev_password@nexus-mongodb:27017/nexus_kyc?authSource=admin
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      # Eureka
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      # Spring AI (gpt-4o required for vision — this costs more than gpt-4o-mini!)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # AWS S3 → LocalStack in dev
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_OVERRIDE: http://nexus-localstack:4566
      KYC_S3_BUCKET: nexus-kyc-documents
      KYC_ENCRYPTION_ENABLED: "false"   # Use placeholder encryption in dev
      # Observability
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: "1.0"
      ENVIRONMENT: local-docker
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-mongodb:
        condition: service_healthy
      nexus-kafka:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
      nexus-localstack:
        condition: service_healthy
      nexus-zipkin:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.40
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8091/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
