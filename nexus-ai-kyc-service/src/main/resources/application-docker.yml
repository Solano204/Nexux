# ══════════════════════════════════════════════════════════════
# nexus-ai-kyc-service — DOCKER profile
# Active when: SPRING_PROFILES_ACTIVE=docker
# Set automatically by Dockerfile ENTRYPOINT: -Dspring.profiles.active=docker
#
# Purpose: Override all localhost addresses with Docker Compose
#          service names. This is the ONLY difference from dev.
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      uri: http://nexus-config-service:8888
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
    bus:
      enabled: true

  threads:
    virtual:
      enabled: true

  # ── PostgreSQL ─────────────────────────────────────────────
  # Immutable KYC audit trail — regulatory requirement
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_kyc}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      pool-name: nexus-kyc-docker-pool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── MongoDB ────────────────────────────────────────────────
  # KYC documents, decisions, GridFS encrypted docs
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://nexus:nexus_dev@nexus-mongodb:27017/nexus_kyc?authSource=admin}
      auto-index-creation: false    # Indexes managed by mongo-init.js

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: nexus-kafka:9092
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ── Spring AI ──────────────────────────────────────────────
  # gpt-4o required — vision-capable for Stage 1 document extraction
  # temperature 0.0 — deterministic, compliance requirement
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
          temperature: 0.0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8091

# ── Eureka ─────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

nexus:
  kyc:
    s3:
      bucket: ${KYC_S3_BUCKET:nexus-kyc-documents}
    encryption:
      enabled: ${KYC_ENCRYPTION_ENABLED:false}
    retry:
      max-attempts: 3
      window-days: 30
    pre-screening:
      min-text-elements: 5
      min-total-characters: 100
      min-face-brightness: 50
      min-face-sharpness: 50

# AWS → LocalStack (Docker service name)
cloud:
  aws:
    region:
      static: ${AWS_REGION:us-east-1}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:test}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    s3:
      endpoint: ${AWS_ENDPOINT_OVERRIDE:http://nexus-localstack:4566}

resilience4j:
  retry:
    instances:
      kyc-vision-retry:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.nexus.kyc.domain.exception.KycProcessingException

# ── Observability ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        kyc.pipeline.total.duration: true
        kyc.stage1.extraction.duration: true
        kyc.stage2.comparison.duration: true
      percentiles:
        kyc.pipeline.total.duration: 0.5, 0.9, 0.95, 0.99
    tags:
      application: nexus-ai-kyc-service
      environment: docker
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    com.nexus.kyc: INFO
    org.springframework.ai: INFO
    org.springframework.data.mongodb: WARN
