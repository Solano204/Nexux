spring:
  application:
    name: nexus-ai-kyc-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      enabled: true

  # ════════════════════════════════════════════════════════
  # POSTGRESQL — Immutable audit trail (kyc_audit_entries)
  # ════════════════════════════════════════════════════════
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5433/nexus_kyc}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ════════════════════════════════════════════════════════
  # MONGODB — KYC documents, decisions, GridFS encrypted docs
  # ════════════════════════════════════════════════════════
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://nexus:nexus_dev@nexus-mongodb:27018/nexus_kyc?authSource=admin}
      auto-index-creation: true

  # ════════════════════════════════════════════════════════
  # KAFKA — SAGA replies + domain events
  # ════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ════════════════════════════════════════════════════════
  # SPRING AI — Two-stage KYC pipeline
  # Stage 1: GPT-4o Vision (document extraction, temp=0.0)
  # Stage 2: GPT-4o-mini (data comparison, temp=0.0)
  # ════════════════════════════════════════════════════════
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
          temperature: 0.0

  # Multipart: up to 10MB document images
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8091

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ══════════════════════════════════════════════════════════
# KYC Service custom configuration
# ══════════════════════════════════════════════════════════
nexus:
  kyc:
    s3:
      bucket: ${KYC_S3_BUCKET:nexus-kyc-documents}
    encryption:
      enabled: ${KYC_ENCRYPTION_ENABLED:false}
    retry:
      max-attempts: 3
      window-days: 30
    pre-screening:
      min-text-elements: 5
      min-total-characters: 100
      min-face-brightness: 50
      min-face-sharpness: 50

resilience4j:
  retry:
    instances:
      kyc-vision-retry:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.nexus.kyc.domain.exception.KycProcessingException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        kyc.pipeline.total.duration: true
        kyc.stage1.extraction.duration: true
        kyc.stage2.comparison.duration: true
      percentiles:
        kyc.pipeline.total.duration: 0.5, 0.9, 0.95, 0.99
        kyc.stage1.extraction.duration: 0.5, 0.9, 0.95, 0.99
        kyc.stage2.comparison.duration: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    com.nexus.kyc: INFO
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level
      traceId=%X{traceId} spanId=%X{spanId}
      service=nexus-ai-kyc-service %logger{36} - %msg%n