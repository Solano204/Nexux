# ══════════════════════════════════════════════════════════════
# nexus-ai-kyc-service — DEV profile
# Active when: SPRING_PROFILES_ACTIVE=dev
#
# Prerequisites:
#   docker compose up -d nexus-postgres nexus-mongodb nexus-kafka \
#     nexus-localstack nexus-config-service nexus-discovery-service
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_kyc
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration   # NOTE: see BUGS.md — fix dir name first
    baseline-on-migrate: true

  data:
    mongodb:
      uri: mongodb://nexus:nexus_dev_password@localhost:27018/nexus_kyc?authSource=admin
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o      # Vision-capable — required for Stage 1
          temperature: 0.0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8091

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

nexus:
  kyc:
    s3:
      bucket: nexus-kyc-documents
    encryption:
      enabled: false    # Placeholder encryption in dev
    retry:
      max-attempts: 2   # Fewer retries in dev
      window-days: 30

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# AWS → LocalStack
cloud:
  aws:
    region:
      static: us-east-1
    credentials:
      access-key: test
      secret-key: test
    s3:
      endpoint: http://localhost:4566

logging:
  level:
    com.nexus.kyc: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org.springframework.data.mongodb: DEBUG
