# ══════════════════════════════════════════════════════════════════════
# audit-write-native — PRODUCTION Docker Compose
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  elasticsearch-audit-data-prod:
  mongodb-audit-data-prod:
  redis-data-prod:
  prometheus-data-prod:
  grafana-data-prod:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:

  nexus-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.name: nexus-audit-cluster-prod
    volumes:
      - elasticsearch-audit-data-prod:/usr/share/elasticsearch/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.7
    logging: *default-logging
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  nexus-mongodb:
    image: mongo:7.0
    container_name: nexus-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: nexus_audit
    volumes:
      - mongodb-audit-data-prod:/data/db
    networks:
      nexus-network:
        ipv4_address: 172.20.0.6
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data-prod:/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: always
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    logging: *default-logging

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: always
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-prod:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - nexus-network
    logging: *default-logging

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-prod:/var/lib/grafana
    networks:
      - nexus-network
    logging: *default-logging

  audit-write-native:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/audit-write-native:${IMAGE_TAG:-latest}
    container_name: audit-write-native
    restart: always
    ports:
      - "8096:8096"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexus-kafka:9092}
      ELASTICSEARCH_HOSTS: http://nexus-elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      MONGODB_URI: mongodb://nexus:${MONGODB_PASSWORD}@nexus-mongodb:27017/nexus_audit?authSource=admin
      REDIS_URL: redis://nexus-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
    depends_on:
      nexus-elasticsearch:
        condition: service_healthy
      nexus-mongodb:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.42
    logging: *default-logging
    # Native binary: minimal resource usage
    deploy:
      resources:
        limits:
          memory: 128m    # ~28MB idle; allow burst for compilation reflection
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/q/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
