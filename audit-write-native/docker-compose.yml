# ══════════════════════════════════════════════════════════════════════
# audit-write-native — LOCAL DEVELOPMENT Docker Compose
#
# This is a QUARKUS NATIVE service, not Spring Boot.
# Key differences:
#   - Startup: ~90ms (vs ~60-90s for Spring Boot services)
#   - Memory: ~28MB idle RSS (vs 256-768MB for Spring Boot services)
#   - Build: ~3-5 MINUTES for native compilation (normal!)
#   - Java: 21 (NOT 25 — GraalVM CE requires Java 21)
#   - No Spring Cloud Config / Eureka dependency
#   - Config via application.properties, not Config Service
#
# Infrastructure:
#   Elasticsearch 8.13  (port 9200) — audit event writes
#   MongoDB 7           (port 27017) — compliance alert writes
#   Redis 7             (port 6379)  — velocity window counters
#   Kafka + Zookeeper   (port 9092)  — 15 topic consumers
#   Zipkin              (port 9411)  — OpenTelemetry traces (NOT Micrometer Brave)
#   Prometheus          (port 9090)
#   Grafana             (port 3000)
#   audit-write-native  (port 8096)
#
# Build options:
#   JVM mode (fast iteration):
#     mvn package -DskipTests
#     docker build -f Dockerfile.jvm -t audit-write-native:jvm .
#
#   Native mode (production):
#     mvn package -Pnative -DskipTests
#     docker build -f Dockerfile.native -t audit-write-native:native .
#     (takes 3-5 minutes — uses GraalVM to compile to binary)
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  elasticsearch-audit-data:
  mongodb-audit-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  prometheus-data:
  grafana-data:

services:

  # ────────────────────────────────────────────────────────────
  # ELASTICSEARCH — audit event index
  # ────────────────────────────────────────────────────────────
  nexus-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: nexus-audit-cluster
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-audit-data:/usr/share/elasticsearch/data
      - ./scripts/setup-elasticsearch.sh:/setup-elasticsearch.sh:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.7
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ────────────────────────────────────────────────────────────
  # MONGODB — compliance alerts
  # ────────────────────────────────────────────────────────────
  nexus-mongodb:
    image: mongo:7.0
    container_name: nexus-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: nexus_dev_password
      MONGO_INITDB_DATABASE: nexus_audit
    ports:
      - "27017:27017"
    volumes:
      - mongodb-audit-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      nexus-network:
        ipv4_address: 172.20.0.6
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ────────────────────────────────────────────────────────────
  # REDIS — velocity window counters
  # ────────────────────────────────────────────────────────────
  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ────────────────────────────────────────────────────────────
  # KAFKA — 15-topic fan-in consumer
  # ────────────────────────────────────────────────────────────
  nexus-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    restart: unless-stopped
    depends_on:
      nexus-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://nexus-kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # OBSERVABILITY
  # Note: uses Zipkin for OpenTelemetry (OTLP), not Micrometer Brave
  # ────────────────────────────────────────────────────────────
  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - nexus-network

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nexus-network

  # ────────────────────────────────────────────────────────────
  # AUDIT WRITE NATIVE SERVICE
  # ────────────────────────────────────────────────────────────
  audit-write-native:
    build:
      context: .
      dockerfile: Dockerfile.native     # 3-5 min native build
    container_name: audit-write-native
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      ELASTICSEARCH_HOSTS: http://nexus-elasticsearch:9200
      MONGODB_URI: mongodb://nexus:nexus_dev_password@nexus-mongodb:27017/nexus_audit?authSource=admin
      REDIS_URL: redis://nexus-redis:6379
      REDIS_PASSWORD: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: "1.0"
    depends_on:
      nexus-elasticsearch:
        condition: service_healthy
      nexus-mongodb:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-kafka:
        condition: service_healthy
      nexus-zipkin:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.42
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/q/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s    # native binary starts in ~90ms
