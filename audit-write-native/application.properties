# ══════════════════════════════════════════════════════════════════════
# audit-write-native — application.properties
# Quarkus GraalVM native service — Java 21, Quarkus 3.8.6
#
# This file was EMPTY in the repo. Created from scratch.
#
# NOTE: This is a STANDALONE Quarkus module (no Spring, no parent POM).
#       All config uses MicroProfile Config / Quarkus properties format.
# ══════════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# SERVER
# ════════════════════════════════════════════════════════════════
quarkus.http.port=8096
quarkus.http.host=0.0.0.0

# ════════════════════════════════════════════════════════════════
# KAFKA — Bootstrap + defaults
# ════════════════════════════════════════════════════════════════
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}

# Default consumer settings applied to all @Incoming channels
mp.messaging.incoming.default.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
mp.messaging.incoming.default.auto.offset.reset=earliest
mp.messaging.incoming.default.enable.auto.commit=false
mp.messaging.incoming.default.isolation.level=read_committed
mp.messaging.incoming.default.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.default.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ════════════════════════════════════════════════════════════════
# KAFKA CHANNEL BINDINGS — 15 @Incoming channels
# Channel name → Kafka topic + consumer group
# Every @Incoming("channel-name") must have a binding here.
# ════════════════════════════════════════════════════════════════

# ── Financial Events ─────────────────────────────────────────

mp.messaging.incoming.transactions-completed.topic=transactions.completed
mp.messaging.incoming.transactions-completed.group.id=audit-write-transactions-completed

mp.messaging.incoming.transactions-failed.topic=transactions.failed
mp.messaging.incoming.transactions-failed.group.id=audit-write-transactions-failed

mp.messaging.incoming.transactions-initiated.topic=transactions.initiated
mp.messaging.incoming.transactions-initiated.group.id=audit-write-transactions-initiated

mp.messaging.incoming.ledger-posted.topic=ledger.posted
mp.messaging.incoming.ledger-posted.group.id=audit-write-ledger-posted

mp.messaging.incoming.ledger-reversed.topic=ledger.reversed
mp.messaging.incoming.ledger-reversed.group.id=audit-write-ledger-reversed

# ── Fraud Events ─────────────────────────────────────────────

mp.messaging.incoming.fraud-result.topic=fraud.result
mp.messaging.incoming.fraud-result.group.id=audit-write-fraud-result

mp.messaging.incoming.fraud-flagged.topic=fraud.flagged
mp.messaging.incoming.fraud-flagged.group.id=audit-write-fraud-flagged

# ── Account Events ───────────────────────────────────────────

mp.messaging.incoming.account-frozen.topic=account.frozen
mp.messaging.incoming.account-frozen.group.id=audit-write-account-frozen

mp.messaging.incoming.accounts-created.topic=accounts.created
mp.messaging.incoming.accounts-created.group.id=audit-write-accounts-created

# ── Identity Events ──────────────────────────────────────────

mp.messaging.incoming.users-registered.topic=users.registered
mp.messaging.incoming.users-registered.group.id=audit-write-users-registered

mp.messaging.incoming.identity-verified.topic=identity.verified
mp.messaging.incoming.identity-verified.group.id=audit-write-identity-verified

mp.messaging.incoming.identity-rejected.topic=identity.rejected
mp.messaging.incoming.identity-rejected.group.id=audit-write-identity-rejected

# ── SAGA Events ──────────────────────────────────────────────

mp.messaging.incoming.saga-completed.topic=saga.completed
mp.messaging.incoming.saga-completed.group.id=audit-write-saga-completed

# ── AI + Analytics Events ────────────────────────────────────

mp.messaging.incoming.ai-query-logged.topic=ai.query.logged
mp.messaging.incoming.ai-query-logged.group.id=audit-write-ai-query-logged

mp.messaging.incoming.analytics-anomalies.topic=analytics.anomalies.detected
mp.messaging.incoming.analytics-anomalies.group.id=audit-write-analytics-anomalies

# ════════════════════════════════════════════════════════════════
# ELASTICSEARCH — Audit event index (write path)
# op_type=create enforced at write time for idempotency.
# ════════════════════════════════════════════════════════════════
elasticsearch.hosts=${ELASTICSEARCH_HOSTS:http://nexus-elasticsearch:9200}

# Index naming: nexus-audit-{yyyy.MM} (monthly rotation)
audit.elasticsearch.index-prefix=nexus-audit
audit.elasticsearch.index-rotation=monthly

# ════════════════════════════════════════════════════════════════
# MONGODB — Compliance alerts
# ════════════════════════════════════════════════════════════════
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://nexus:nexus_dev_password@nexus-mongodb:27017/nexus_audit?authSource=admin}
quarkus.mongodb.database=nexus_audit

# ════════════════════════════════════════════════════════════════
# REDIS — Velocity window counters for compliance rules
# ════════════════════════════════════════════════════════════════
quarkus.redis.hosts=${REDIS_URL:redis://nexus-redis:6379}
quarkus.redis.password=${REDIS_PASSWORD:}

# ════════════════════════════════════════════════════════════════
# COMPLIANCE RULES
# ════════════════════════════════════════════════════════════════
compliance.large-transaction-threshold=10000
compliance.velocity-window-seconds=300
compliance.velocity-max-count=5
compliance.structuring-lower-bound=7000
compliance.high-fraud-score-threshold=70

# ════════════════════════════════════════════════════════════════
# OBSERVABILITY — OpenTelemetry + Prometheus
# ════════════════════════════════════════════════════════════════
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}
quarkus.otel.traces.enabled=true
quarkus.otel.traces.sampler=traceidratio
quarkus.otel.traces.sampler.arg=${TRACING_SAMPLE_RATE:1.0}

# Prometheus metrics at /q/metrics
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Health endpoints at /q/health
quarkus.smallrye-health.root-path=/q/health

# ════════════════════════════════════════════════════════════════
# LOGGING
# ════════════════════════════════════════════════════════════════
quarkus.log.level=INFO
quarkus.log.category."com.nexus.audit".level=INFO
quarkus.log.category."io.smallrye.reactive.messaging".level=WARN
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."io.quarkus".level=WARN

# Structured JSON logging in docker profile
%docker.quarkus.log.console.json=true
%docker.quarkus.log.console.json.additional-field."service".value=audit-write-native
%docker.quarkus.log.console.json.additional-field."service".type=String

# ════════════════════════════════════════════════════════════════
# NATIVE IMAGE — GraalVM compilation hints
# ════════════════════════════════════════════════════════════════
# Register Jackson reflection for native compilation
quarkus.native.additional-build-args=-H:IncludeResources=application.properties

# ════════════════════════════════════════════════════════════════
# DEV PROFILE OVERRIDES (%dev. prefix)
# ════════════════════════════════════════════════════════════════
%dev.quarkus.log.category."com.nexus.audit".level=DEBUG
%dev.quarkus.log.category."io.smallrye.reactive.messaging".level=INFO
%dev.quarkus.otel.traces.sampler.arg=1.0

# Dev Elasticsearch (no security)
%dev.elasticsearch.hosts=http://localhost:9200
%dev.quarkus.mongodb.connection-string=mongodb://nexus:nexus_dev_password@localhost:27017/nexus_audit?authSource=admin
%dev.quarkus.redis.hosts=redis://localhost:6379
%dev.quarkus.redis.password=

# ════════════════════════════════════════════════════════════════
# PRODUCTION PROFILE OVERRIDES (%prod. prefix = default in native)
# ════════════════════════════════════════════════════════════════
%prod.quarkus.log.category."com.nexus.audit".level=INFO
%prod.quarkus.otel.traces.sampler.arg=${TRACING_SAMPLE_RATE:0.1}
