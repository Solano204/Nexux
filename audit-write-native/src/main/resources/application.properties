# ================================================================
# ELASTICSEARCH
# ================================================================
elasticsearch.hosts=${ELASTICSEARCH_HOSTS:http://localhost:9201}
audit.elasticsearch.index-prefix=nexus-audit
audit.elasticsearch.index-rotation=monthly

# ================================================================
# MONGODB
# ================================================================
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://nexus:nexus_dev_password@localhost:27018/nexus_audit?authSource=admin}
quarkus.mongodb.database=nexus_audit

# ================================================================
# REDIS
# ================================================================
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6380}
quarkus.redis.password=${REDIS_PASSWORD:}

# ================================================================
# COMPLIANCE RULES
# ================================================================
compliance.large-transaction-threshold=10000
compliance.velocity-window-seconds=300
compliance.velocity-max-count=5
compliance.structuring-lower-bound=7000
compliance.high-fraud-score-threshold=70

# ================================================================
# OBSERVABILITY
# ================================================================
# Zipkin exporter (see pom.xml: io.opentelemetry:opentelemetry-exporter-zipkin).
# OTLP is explicitly disabled - it was previously misconfigured to point at
# Zipkin's v2 JSON endpoint, which doesn't speak OTLP's gRPC/protobuf
# protocol, so spans never actually reached Zipkin.
quarkus.otel.traces.enabled=true
# parentbased_traceidratio, NOT plain traceidratio: the bare "traceidratio"
# value ignores whatever sampling decision the incoming B3 header already
# carries and re-rolls its own probability on every single span - since this
# service is fan-in-only (see Section 1 of CHANGES-BESTPRACTICES/
# 03_ZIPKIN_TRACING_CHANGES.md), virtually every span here has a parent from
# a Spring producer and should inherit that producer's sampled/not-sampled
# flag, not decide independently. Only matters once sampler.arg < 1.0 (prod) -
# invisible in dev where arg=1.0 makes both variants sample everything either way.
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${TRACING_SAMPLE_RATE:1.0}
quarkus.otel.exporter.otlp.enabled=false
# Read by ZipkinExporterProducer (config/ZipkinExporterProducer.java) - a
# CDI-produced SpanExporter bean, not a quarkus.otel.exporter.zipkin.*
# config property (that property doesn't exist in this Quarkus version;
# build failed with "Unrecognized configuration key" when tried).
nexus.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9412/api/v2/spans}
# Rest of the platform standardizes on Brave/B3 single-header propagation
# (nexus-platform-config: management.tracing.propagation.type=B3). OTel
# defaults to W3C tracecontext, so this must be set explicitly or this
# service can't continue/be continued by the Spring services' traces.
# Prefix is quarkus.otel (not quarkus.opentelemetry) - matches every other
# recognized property in this file; the opentelemetry-prefixed one above
# was rejected as unrecognized in the same build that accepted these.
quarkus.otel.propagators=b3
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.smallrye-health.root-path=/q/health

# ================================================================
# LOGGING
# ================================================================
quarkus.log.level=INFO
quarkus.log.category."com.nexus.audit".level=INFO
quarkus.log.category."io.smallrye.reactive.messaging".level=WARN
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."io.quarkus".level=WARN

# ================================================================
# DEV PROFILE (%dev. prefix - active with: mvn quarkus:dev)
# ================================================================
%dev.kafka.bootstrap.servers=localhost:19092
%dev.elasticsearch.hosts=http://localhost:9201
%dev.quarkus.elasticsearch.hosts=localhost:9201
%dev.quarkus.mongodb.connection-string=mongodb://nexus:nexus_dev_password@localhost:27018/nexus_audit?authSource=admin
%dev.quarkus.redis.hosts=redis://localhost:6380
%dev.quarkus.redis.password=
%dev.nexus.zipkin.endpoint=http://localhost:9412/api/v2/spans
%dev.quarkus.log.category."com.nexus.audit".level=DEBUG
%dev.quarkus.log.category."io.smallrye.reactive.messaging".level=INFO
%dev.quarkus.otel.traces.sampler.arg=1.0
%dev.compliance.large-transaction-threshold=100000

# ================================================================
# DOCKER PROFILE (%docker. prefix)
# ================================================================
%docker.kafka.bootstrap.servers=nexus-kafka:9092
%docker.elasticsearch.hosts=http://nexus-elasticsearch:9200
%docker.quarkus.elasticsearch.hosts=nexus-elasticsearch:9200
%docker.quarkus.mongodb.connection-string=mongodb://nexus:nexus_dev_password@nexus-mongodb:27017/nexus_audit?authSource=admin
%docker.quarkus.redis.hosts=redis://nexus-redis:6379
%docker.quarkus.redis.password=${REDIS_PASSWORD:}
%docker.nexus.zipkin.endpoint=http://nexus-zipkin:9411/api/v2/spans
%docker.quarkus.log.console.json=true
%docker.quarkus.log.console.json.additional-field."service".value=audit-write-native
%docker.quarkus.log.console.json.additional-field."service".type=String

# ================================================================
# PRODUCTION PROFILE (%prod. prefix - default for native binary)
# ================================================================
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%prod.elasticsearch.hosts=${ELASTICSEARCH_HOSTS}
%prod.quarkus.elasticsearch.hosts=nexus-elasticsearch:9200
%prod.quarkus.mongodb.connection-string=${MONGODB_URI}
%prod.quarkus.redis.hosts=${REDIS_URL}
%prod.quarkus.redis.password=${REDIS_PASSWORD}
%prod.nexus.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}
%prod.quarkus.log.console.json=true
%prod.quarkus.otel.traces.sampler.arg=${TRACING_SAMPLE_RATE:0.1}
%prod.quarkus.log.category."com.nexus.audit".level=INFO