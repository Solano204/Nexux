# audit-write-native ? application.properties
# Quarkus 3.x native service ? Java 21, GraalVM
# This is the base file. Profiles use %dev. / %docker. / %prod. prefixes.

# ????????????????????????????????????????????????????????????????
# SERVER
# ????????????????????????????????????????????????????????????????
quarkus.http.port=8096
quarkus.http.host=0.0.0.0

# ????????????????????????????????????????????????????????????????
# KAFKA ? Bootstrap + channel bindings
# ????????????????????????????????????????????????????????????????
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}

mp.messaging.incoming.transactions-completed.connector=smallrye-kafka
mp.messaging.incoming.transactions-completed.topic=transactions.completed
mp.messaging.incoming.transactions-completed.group.id=audit-write-transactions-completed
mp.messaging.incoming.transactions-completed.auto.offset.reset=earliest
mp.messaging.incoming.transactions-completed.enable.auto.commit=false
mp.messaging.incoming.transactions-completed.isolation.level=read_committed

mp.messaging.incoming.transactions-failed.connector=smallrye-kafka
mp.messaging.incoming.transactions-failed.topic=transactions.failed
mp.messaging.incoming.transactions-failed.group.id=audit-write-transactions-failed
mp.messaging.incoming.transactions-failed.auto.offset.reset=earliest
mp.messaging.incoming.transactions-failed.enable.auto.commit=false

mp.messaging.incoming.transactions-initiated.connector=smallrye-kafka
mp.messaging.incoming.transactions-initiated.topic=transactions.initiated
mp.messaging.incoming.transactions-initiated.group.id=audit-write-transactions-initiated
mp.messaging.incoming.transactions-initiated.auto.offset.reset=earliest
mp.messaging.incoming.transactions-initiated.enable.auto.commit=false

mp.messaging.incoming.ledger-posted.connector=smallrye-kafka
mp.messaging.incoming.ledger-posted.topic=ledger.posted
mp.messaging.incoming.ledger-posted.group.id=audit-write-ledger-posted
mp.messaging.incoming.ledger-posted.auto.offset.reset=earliest
mp.messaging.incoming.ledger-posted.enable.auto.commit=false

mp.messaging.incoming.ledger-reversed.connector=smallrye-kafka
mp.messaging.incoming.ledger-reversed.topic=ledger.reversed
mp.messaging.incoming.ledger-reversed.group.id=audit-write-ledger-reversed
mp.messaging.incoming.ledger-reversed.auto.offset.reset=earliest
mp.messaging.incoming.ledger-reversed.enable.auto.commit=false

mp.messaging.incoming.fraud-result.connector=smallrye-kafka
mp.messaging.incoming.fraud-result.topic=fraud.result
mp.messaging.incoming.fraud-result.group.id=audit-write-fraud-result
mp.messaging.incoming.fraud-result.auto.offset.reset=earliest
mp.messaging.incoming.fraud-result.enable.auto.commit=false

mp.messaging.incoming.fraud-flagged.connector=smallrye-kafka
mp.messaging.incoming.fraud-flagged.topic=fraud.flagged
mp.messaging.incoming.fraud-flagged.group.id=audit-write-fraud-flagged
mp.messaging.incoming.fraud-flagged.auto.offset.reset=earliest
mp.messaging.incoming.fraud-flagged.enable.auto.commit=false

mp.messaging.incoming.account-frozen.connector=smallrye-kafka
mp.messaging.incoming.account-frozen.topic=account.frozen
mp.messaging.incoming.account-frozen.group.id=audit-write-account-frozen
mp.messaging.incoming.account-frozen.auto.offset.reset=earliest
mp.messaging.incoming.account-frozen.enable.auto.commit=false

mp.messaging.incoming.accounts-created.connector=smallrye-kafka
mp.messaging.incoming.accounts-created.topic=accounts.created
mp.messaging.incoming.accounts-created.group.id=audit-write-accounts-created
mp.messaging.incoming.accounts-created.auto.offset.reset=earliest
mp.messaging.incoming.accounts-created.enable.auto.commit=false

mp.messaging.incoming.users-registered.connector=smallrye-kafka
mp.messaging.incoming.users-registered.topic=users.registered
mp.messaging.incoming.users-registered.group.id=audit-write-users-registered
mp.messaging.incoming.users-registered.auto.offset.reset=earliest
mp.messaging.incoming.users-registered.enable.auto.commit=false

mp.messaging.incoming.identity-verified.connector=smallrye-kafka
mp.messaging.incoming.identity-verified.topic=identity.verified
mp.messaging.incoming.identity-verified.group.id=audit-write-identity-verified
mp.messaging.incoming.identity-verified.auto.offset.reset=earliest
mp.messaging.incoming.identity-verified.enable.auto.commit=false

mp.messaging.incoming.identity-rejected.connector=smallrye-kafka
mp.messaging.incoming.identity-rejected.topic=identity.rejected
mp.messaging.incoming.identity-rejected.group.id=audit-write-identity-rejected
mp.messaging.incoming.identity-rejected.auto.offset.reset=earliest
mp.messaging.incoming.identity-rejected.enable.auto.commit=false

mp.messaging.incoming.saga-completed.connector=smallrye-kafka
mp.messaging.incoming.saga-completed.topic=saga.completed
mp.messaging.incoming.saga-completed.group.id=audit-write-saga-completed
mp.messaging.incoming.saga-completed.auto.offset.reset=earliest
mp.messaging.incoming.saga-completed.enable.auto.commit=false

mp.messaging.incoming.ai-query-logged.connector=smallrye-kafka
mp.messaging.incoming.ai-query-logged.topic=ai.query.logged
mp.messaging.incoming.ai-query-logged.group.id=audit-write-ai-query-logged
mp.messaging.incoming.ai-query-logged.auto.offset.reset=earliest
