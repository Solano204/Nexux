# audit-write-native - application.properties
# Quarkus 3.x native service - Java 21, GraalVM
# This is the base file. Profiles use %dev. / %docker. / %prod. prefixes.

# ================================================================
# SERVER
# ================================================================
quarkus.http.port=8096
quarkus.http.host=0.0.0.0

# Mirrors nexus-platform-config/application-prod.yml's server.shutdown:
# graceful + timeout-per-shutdown-phase: 30s for the Spring services -
# this service sits outside Spring Cloud Config (Quarkus, not a Spring
# Cloud Config client), so it needs its own copy of the same setting.
# Lets the Kafka reactive-messaging consumers above finish their current
# poll/ack cycle instead of dropping a message mid-processing on
# SIGTERM/`docker compose stop`.
quarkus.shutdown.timeout=30s

# quarkus.application.name feeds the OTel Resource's service.name attribute
# (this is what Zipkin's service dropdown/service-map shows). Left unset,
# Quarkus falls back to OTel SDK's generic "unknown_service:java" - every
# span from this service would be lumped under that name, indistinguishable
# from any other unnamed OTel source, which defeats the point of verifying
# the B3 propagation fix below by looking for this service in Zipkin.
quarkus.application.name=audit-write-native

# ================================================================
# KAFKA - Bootstrap + channel bindings
# ================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

mp.messaging.incoming.transactions-completed.connector=smallrye-kafka
mp.messaging.incoming.transactions-completed.topic=transactions.completed
mp.messaging.incoming.transactions-completed.group.id=audit-write-transactions-completed
mp.messaging.incoming.transactions-completed.auto.offset.reset=earliest
mp.messaging.incoming.transactions-completed.enable.auto.commit=false
mp.messaging.incoming.transactions-completed.isolation.level=read_committed

