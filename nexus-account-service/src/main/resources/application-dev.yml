spring:
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_accounts
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: nexus-account-dev-pool

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

  data:
    mongodb:
      uri: mongodb://nexus:nexus_dev_password@localhost:27018/nexus_accounts?authSource=admin
    redis:
      host: localhost
      port: 6380
      password: ""

  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: account-service-saga-commands-dev

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9412/api/v2/spans

logging:
  level:
    com.nexus.account: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.kafka: DEBUG
