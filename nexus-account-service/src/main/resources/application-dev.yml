spring:
  cloud:
    config:
      enabled: false

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_accounts
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: nexus-account-dev-pool


  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

  data:
    mongodb:
      uri: mongodb://localhost:27018/nexus_accounts
    redis:
      host: localhost
      port: 6380
      password: ""

  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: account-service-saga-commands-dev

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9412/api/v2/spans

logging:
  level:
    com.nexus.saga: DEBUG          # tus logs de negocio — los únicos que quieres ver
    org.springframework.kafka: WARN
    org.apache.kafka.clients: WARN
    org.springframework.kafka.listener.KafkaMessageListenerContainer: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
    org.springframework.ai: WARN
