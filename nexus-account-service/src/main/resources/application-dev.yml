# ══════════════════════════════════════════════════════════════
# nexus-account-service — DEV profile
# Active when: SPRING_PROFILES_ACTIVE=dev
# Purpose: Isolated JVM runtime connected to local Docker Infra
# ══════════════════════════════════════════════════════════════

spring:
  # ── DESACTIVAR CONFIG SERVER REMOTO ─────────────────────────
  cloud:
    config:
      enabled: false      # Forzar apagado de la búsqueda externa en Git
      fail-fast: false

  threads:
    virtual:
      enabled: true       # Virtual Threads nativos para Java 25

  # ── JPA + POSTGRESQL CON PGVECTOR (CONTENEDOR PUERTO 5433) ──
  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_accounts
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: nexus-account-dev-pool
      data-source-properties:
        lock_timeout: 10000
        statement_timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  # ── MONGODB REDIRIGIDO AL PUERTO LIBRE 27018 ────────────────
  data:
    mongodb:
      # 🔐 CADENA ESTÁTICA LIMPIA: Sin llaves dinámicas para evitar romper el ASM Reader
      uri: mongodb://nexus:nexus_dev_password@localhost:27018/nexus_accounts?authSource=admin
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 500ms

  # ── KAFKA NATIVO LOCAL ──────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-service-saga-commands-dev

  # ── CONFIGURACIÓN VECTORIAL (SPRING AI) ──────────────────────
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
    vectorstore:
      pgvector:
        initialize-schema: true    # Creará la tabla transaction_embeddings en el Docker con pgvector
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: transaction_embeddings

server:
  port: 8085

# ── HANDSHAKE DE EUREKA LOCAL ─────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-admin-password@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.nexus.account: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.flywaydb: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.kafka: DEBUG