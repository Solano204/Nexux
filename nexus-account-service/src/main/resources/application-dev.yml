# ══════════════════════════════════════════════════════════════
# nexus-account-service — DEV profile
# Active when: SPRING_PROFILES_ACTIVE=dev
# Run from IDE or  mvn spring-boot:run  directly on your machine.
#
# Prerequisites (start these first):
#   docker compose up -d nexus-postgres nexus-mongodb nexus-redis \
#     nexus-kafka nexus-config-service nexus-discovery-service
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      enabled: false
      fail-fast: false
    bus:
      enabled: false

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_account
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: nexus-account-dev-pool
      data-source-properties:
        lock_timeout: 10000          # More lenient in dev (debugging)
        statement_timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    mongodb:
      uri: mongodb://nexus:nexus_dev_password@localhost:27017/nexus_account?authSource=admin
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 500ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-service-saga-commands-dev

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
    vectorstore:
      pgvector:
        initialize-schema: true    # Creates transaction_embeddings table
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: transaction_embeddings

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.nexus.account: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.flywaydb: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.kafka: DEBUG
