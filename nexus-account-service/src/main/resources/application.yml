spring:
  application:
    name: nexus-account-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      # disabled: Brave's ThreadLocal trace context doesn't survive virtual
      # thread mount/unmount - controller-dispatched spans were silently
      # never exported to Zipkin (actuator/internal spans traced fine).
      enabled: false

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexus_accounts}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:nexus_dev_password}
    hikari:
      # Fase 8 (resiliencia guide): was 10 against a Tomcat threads.max of
      # 150 (Fase 6) with no connection-timeout override — up to 150
      # concurrent requests could queue for only 10 connections, each
      # waiting HikariCP's 30s default before failing, 6x past the 5s HTTP
      # timeout ceiling from Fase 1. A client would already have given up
      # and possibly retried (Fase 2) long before Hikari itself gave up.
      # Bumped modestly, not to 1:1 with Tomcat threads — this host has a
      # documented history of running out of memory with too many
      # concurrent containers/connections open at once, and HikariCP's own
      # sizing guidance is that pools smaller than thread-count are often
      # correct for fast queries, not a bug by themselves.
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 3000
      pool-name: nexus-account-pool
      data-source-properties:
        lock_timeout: 10000
        statement_timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/nexus_accounts}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: account-service-saga-commands
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    listener:
      ack-mode: manual

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: transaction_embeddings

server:
  port: 8085
  tomcat:
    threads:
      max: 150
    accept-count: 75

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true

nexus:
  load-shedding:
    max-in-flight: 120

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.nexus.saga: DEBUG          # tus logs de negocio — los únicos que quieres ver
    org.springframework.kafka: WARN
    org.apache.kafka.clients: WARN
    org.springframework.kafka.listener.KafkaMessageListenerContainer: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
    org.springframework.ai: WARN

