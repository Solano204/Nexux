# src/main/resources/application.yml

spring:
  application:
    name: nexus-account-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: http://nexus-config-service:8888
      fail-fast: true
      retry:
        max-attempts: 10

  # ════════════════════════════════════════════════════════════
  # VIRTUAL THREADS — Java 25
  # SELECT FOR UPDATE blocking is transparent to carrier threads
  # ════════════════════════════════════════════════════════════
  threads:
    virtual:
      enabled: true

  # ════════════════════════════════════════════════════════════
  # POSTGRESQL — Critical tuning for balance operations
  # ════════════════════════════════════════════════════════════
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_account}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      # Large pool: needed because SELECT FOR UPDATE holds connections
      # while locks are held by concurrent SAGA operations
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: nexus-account-pool
      # PostgreSQL lock_timeout: fail fast on lock contention
      data-source-properties:
        lock_timeout: 5000
        statement_timeout: 30000
        application_name: nexus-account-service

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          provider_disables_autocommit: true
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ════════════════════════════════════════════════════════════
  # MONGODB — Account analytics documents
  # ════════════════════════════════════════════════════════════
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://nexus:nexus_dev@nexus-mongodb:27017/nexus_account?authSource=admin}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:nexus-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms

  # ════════════════════════════════════════════════════════════
  # KAFKA — Saga commands consumer + Outbox producer
  # ════════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: account-service-saga-commands
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    listener:
      ack-mode: manual

  # ════════════════════════════════════════════════════════════
  # SPRING AI — Account advisor RAG pipeline
  # ════════════════════════════════════════════════════════════
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        schema-name: public
        table-name: transaction_embeddings
        schema-validation: true

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers,busrefresh
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        account.balance.reservation.duration: true
        account.balance.lock.wait.duration: true
      percentiles:
        account.balance.reservation.duration: 0.5, 0.9, 0.95, 0.99
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    com.nexus.account: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level
      traceId=%X{traceId} spanId=%X{spanId}
      service=nexus-account-service %logger{36} - %msg%n