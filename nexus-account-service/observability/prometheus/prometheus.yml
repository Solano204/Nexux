global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-docker
    platform: nexus-financial

scrape_configs:
  - job_name: nexus-account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [nexus-account-service:8085]
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: nexus-account-service

  - job_name: nexus-config-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [nexus-config-service:8888]

  - job_name: nexus-discovery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [nexus-discovery-service:8761]
