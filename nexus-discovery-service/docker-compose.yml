# ══════════════════════════════════════════════════════════════════════
# nexus-discovery-service — LOCAL DEVELOPMENT Docker Compose
#
# The discovery service is the SECOND service to start (after config).
# All 13 business services depend on it being healthy.
#
# Infrastructure:
#   nexus-config-service  (port 8888) — discovery fetches its own config from here
#   nexus-discovery-service (port 8761)
#
# NO database, NO Kafka, NO Redis, NO AI.
# Pure in-memory Eureka registry with HTTP API.
#
# Ports:
#   8761  — Eureka dashboard + API (http://localhost:8761)
#   8888  — Config Service
#
# Usage:
#   docker compose up -d
#   # Wait for healthy, then check registered services:
#   curl http://localhost:8761/eureka/apps
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:

  nexus-config-service:
    image: nexusplatform/nexus-config-service:latest
    container_name: nexus-config-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  nexus-discovery-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URI: http://nexus-config-service:8888
      CONFIG_SERVER_USERNAME: nexus-config
      CONFIG_SERVER_PASSWORD: nexus-config-password
      EUREKA_USERNAME: eureka-admin
      EUREKA_PASSWORD: eureka-admin-password
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      ENVIRONMENT: local-docker
    depends_on:
      nexus-config-service:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
