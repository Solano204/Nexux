# ══════════════════════════════════════════════════════════════════════
# nexus-transaction-service — PRODUCTION Docker Compose
#
# Key production differences:
#   - Elasticsearch security ENABLED (TLS + basic auth)
#   - Kafka exactly-once guarantees enforced
#   - Kafka Streams state dir on a named volume (survives restarts)
#   - Resource limits on all containers
#   - No hardcoded passwords
#   - json-file logging with rotation
#
# Required env vars:
#   POSTGRES_PASSWORD, ELASTICSEARCH_PASSWORD, GRAFANA_ADMIN_PASSWORD
#
# Usage:
#   cp .env.example .env && nano .env
#   docker compose -f docker-compose.prod.yml up -d
# ══════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-transaction-data-prod:
  elasticsearch-data-prod:
  kafka-streams-state-prod:    # Persists RocksDB state across container restarts
  prometheus-data-prod:
  grafana-data-prod:
  loki-data-prod:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:

  nexus-postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus_transaction
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-transaction-data-prod:/var/lib/postgresql/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_transaction"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nexus-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      # Security ON in production
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"  # TLS terminated at LB
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.name: nexus-transaction-cluster-prod
    volumes:
      - elasticsearch-data-prod:/usr/share/elasticsearch/data
    networks:
      nexus-network:
        ipv4_address: 172.20.0.7
    logging: *default-logging
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  nexus-config-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-config-service:${IMAGE_TAG:-latest}
    container_name: nexus-config-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nexus-discovery-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-discovery-service:${IMAGE_TAG:-latest}
    container_name: nexus-discovery-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      nexus-network:
        ipv4_address: 172.20.0.21
    logging: *default-logging
    depends_on:
      nexus-config-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nexus-zipkin:
    image: openzipkin/zipkin:3.1
    container_name: nexus-zipkin
    restart: always
    environment:
      STORAGE_TYPE: mem
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  nexus-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: always
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-prod:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - nexus-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"

  nexus-loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: always
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki-data-prod:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - nexus-network
    logging: *default-logging

  nexus-grafana:
    image: grafana/grafana:10.2.3
    container_name: nexus-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-prod:/var/lib/grafana
    networks:
      - nexus-network
    logging: *default-logging
    depends_on:
      - nexus-prometheus
      - nexus-loki

  nexus-transaction-service:
    image: ${DOCKER_HUB_USERNAME:-nexusplatform}/nexus-transaction-service:${IMAGE_TAG:-latest}
    container_name: nexus-transaction-service
    restart: always
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_transaction
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # In production, Elasticsearch has security enabled
      ELASTICSEARCH_URI: http://nexus-elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexus-kafka:9092}
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      LOKI_URL: http://nexus-loki:3100/loki/api/v1/push
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      ENVIRONMENT: production
      # Kafka Streams state stored on a named volume in prod
      KAFKA_STREAMS_STATE_DIR: /var/kafka-streams-state
    volumes:
      - kafka-streams-state-prod:/var/kafka-streams-state
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-elasticsearch:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
    networks:
      nexus-network:
        ipv4_address: 172.20.0.33
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
