spring:
  application:
    name: nexus-transaction-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5433/nexus_transactions}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      data-source-properties:
        lock_timeout: 5000
        application_name: nexus-transaction-service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ════════════════════════════════════════════════════════════
  # ELASTICSEARCH
  # ════════════════════════════════════════════════════════════
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://nexus-elasticsearch:9200}
    connection-timeout: 5s
    socket-timeout: 30s

  # ════════════════════════════════════════════════════════════
  # KAFKA — Producer + Consumer + Streams
  # ════════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    listener:
      ack-mode: manual
    streams:
      application-id: nexus-transaction-streams
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:nexus-kafka:9092}
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        # RocksDB state stores for Kafka Streams
        state.dir: /tmp/kafka-streams-state
        # Exactly-once semantics for streams
        processing.guarantee: exactly_once_v2
        commit.interval.ms: 100
        # Window store retention
        window.store.change.log.additional.retention.ms: 86400000

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://nexus-discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        transaction.processing.time: true
        http.server.requests: true
      percentiles:
        transaction.processing.time: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nexus-zipkin:9411/api/v2/spans}

logging:
  level:
    com.nexus.transaction: INFO
    org.apache.kafka.streams: INFO
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level
      traceId=%X{traceId} spanId=%X{spanId}
      service=nexus-transaction-service %logger{36} - %msg%n