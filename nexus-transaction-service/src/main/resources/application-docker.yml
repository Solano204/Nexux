# nexus-transaction-service — DOCKER profile
spring:
  cloud:
    config:
      uri: http://nexus-config-service:8888
      enabled: true
      fail-fast: true
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
    bus:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://nexus-postgres:5432/nexus_transaction}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 80
      minimum-idle: 10
      pool-name: nexus-transaction-docker-pool
      data-source-properties:
        lock_timeout: 5000
        application_name: nexus-transaction-service

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  elasticsearch:
    uris: http://nexus-elasticsearch:9200

  kafka:
    bootstrap-servers: nexus-kafka:9092
    producer:
      acks: all
      enable-idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    streams:
      application-id: nexus-transaction-streams
      bootstrap-servers: nexus-kafka:9092
      properties:
        state.dir: /var/kafka-streams-state
        processing.guarantee: exactly_once_v2
        commit.interval.ms: 100

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://nexus-discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: http://nexus-zipkin:9411/api/v2/spans

logging:
  level:
    com.nexus.transaction: INFO
    org.apache.kafka.streams: WARN
