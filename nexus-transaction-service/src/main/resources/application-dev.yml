# ══════════════════════════════════════════════════════════════
# nexus-transaction-service — DEV profile
# Active when: SPRING_PROFILES_ACTIVE=dev
# Run from IDE or  mvn spring-boot:run  on your machine.
#
# Prerequisites (start these first):
#   docker compose up -d nexus-postgres nexus-elasticsearch \
#     nexus-kafka nexus-config-service nexus-discovery-service
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
      retry:
        max-attempts: 3
      username: ${CONFIG_SERVER_USERNAME:nexus-config}
      password: ${CONFIG_SERVER_PASSWORD:nexus-config-password}

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_transactions
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        lock_timeout: 30000       # More lenient in dev
        application_name: nexus-transaction-service-dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 10s
    socket-timeout: 60s

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      enable-idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    streams:
      application-id: nexus-transaction-streams-dev
      bootstrap-servers: localhost:9092
      properties:
        state.dir: /tmp/kafka-streams-state-dev
        processing.guarantee: at_least_once   # Easier to reset in dev
        commit.interval.ms: 1000

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.nexus.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    org.apache.kafka.streams: DEBUG
    org.springframework.data.elasticsearch: DEBUG
    org.flywaydb: DEBUG
