# ================================================================
# NEXUS PLATFORM - GLOBAL PRODUCTION DOCKER COMPOSE
# ================================================================
# All 16 services + all infrastructure.
# Network: nexus-network (containers communicate by service name).
#
# HOST PORT MAPPING (PORT+1 from local dev to avoid conflicts):
#   PostgreSQL:      5435:5432   (local dev uses 5434)
#   MongoDB:         27020:27017  (local dev uses 27019)
#   Redis:           6382:6379    (local dev uses 6381)
#   Elasticsearch:   9203:9200    (local dev uses 9202)
#   Kafka (ext):     19094:9092   (local dev uses 19093)
#   Zipkin:          9414:9411    (local dev uses 9413)
#   Prometheus:      9094:9090    (local dev uses 9093)
#   Grafana:         3003:3000    (local dev uses 3002)
#   Kafdrop:         9004:9000    (local dev uses 9003)
#   Kafka Connect:   18083:8083   (avoids conflict with identity :8083)
#   Config Service:  8888:8888
#   Discovery:       8761:8761
#   API Gateway:     8080:8080
#
# STARTUP PROFILES (start in groups to manage memory):
#
#   Step 1 — Infrastructure (no profile needed):
#     docker compose -f docker-compose-prod.yml up -d
#
#   Step 2 — Core platform (config + discovery):
#     docker compose -f docker-compose-prod.yml --profile core up -d
#
#   Step 3 — Auth service:
#     docker compose -f docker-compose-prod.yml --profile auth up -d
#
#   Step 4 — Transaction cluster (account, txn, fraud, ledger, saga):
#     docker compose -f docker-compose-prod.yml --profile txn up -d
#
#   Step 5 — AI cluster (assistant, kyc, analytics):
#     docker compose -f docker-compose-prod.yml --profile ai up -d
#
#   Step 6 — Support cluster (notification, risk, audit):
#     docker compose -f docker-compose-prod.yml --profile support up -d
#
#   Step 7 — API Gateway:
#     docker compose -f docker-compose-prod.yml --profile gateway up -d
#
#   Or start everything at once (if memory allows):
#     docker compose -f docker-compose-prod.yml \
#       --profile core --profile auth --profile txn \
#       --profile ai --profile support --profile gateway up -d
#
# REQUIRED .env VARIABLES:
#   POSTGRES_PASSWORD, MONGO_PASSWORD, REDIS_PASSWORD
#   GRAFANA_PASSWORD, CONFIG_SERVER_PASSWORD
#   JWT_KEYSTORE_PASSWORD, GIT_TOKEN, OPENAI_API_KEY
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   KYC_S3_BUCKET, KYC_SQS_QUEUE_URL
#   SNS_FRAUD_ALERTS_TOPIC_ARN, SNS_NOTIFICATION_DISPATCH_TOPIC_ARN
# ================================================================

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  elasticsearch-data:
  kafka-data:
  zookeeper-data:
  grafana-data:
  prometheus-data:
  ollama-data:

# ================================================================
# INFRASTRUCTURE SERVICES (no profiles — always start first)
# docker compose -f docker-compose-prod.yml up -d
# ================================================================
services:

  # ── PostgreSQL ────────────────────────────────────────────────
  nexus-postgres:
    image: pgvector/pgvector:pg16-bookworm
    container_name: nexus-postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_connections=300"
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_MULTIPLE_DATABASES: nexus_accounts,nexus_transactions,nexus_identity,nexus_fraud,nexus_ledger,nexus_saga,nexus_risk,nexus_kyc,nexus_audit,nexus_ai_assistant
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh:ro
    ports:
      - "5435:5432"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ── MongoDB ───────────────────────────────────────────────────
  nexus-mongodb:
    image: mongo:7.0
    container_name: nexus-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?required}
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27020:27017"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────
  nexus-redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?required} --maxmemory 1gb --maxmemory-policy allkeys-lru --maxclients 10000
    environment:
      # Needed so the healthcheck shell can read $$REDIS_PASSWORD
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: nexus-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPRING_DATA_REDIS_TIMEOUT: 5s
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 5s
    volumes:
      - redis-data:/data
    ports:
      - "6382:6379"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Zookeeper ─────────────────────────────────────────────────
  nexus-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nexus-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat"
    volumes:
      - zookeeper-data:/var/lib/zookeeper
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Kafka ─────────────────────────────────────────────────────
  nexus-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexus-kafka
    depends_on:
      nexus-zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # INTERNAL: used by all Docker services (nexus-kafka:9092)
      # EXTERNAL: used by host machine tools on localhost:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://nexus-kafka:9092,EXTERNAL://localhost:19094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "19094:9092"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ── Elasticsearch ─────────────────────────────────────────────
  nexus-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - bootstrap.memory_lock=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9203:9200"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ── Zipkin ────────────────────────────────────────────────────
  nexus-zipkin:
    image: openzipkin/zipkin:3.3
    container_name: nexus-zipkin
    ports:
      - "9414:9411"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────
  nexus-prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nexus-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9094:9090"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────
  nexus-grafana:
    image: grafana/grafana:10.4.0
    container_name: nexus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-nexus-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3003:3000"
    networks:
      - nexus-network
    depends_on:
      nexus-prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Kafdrop (Kafka UI) ────────────────────────────────────────
  nexus-kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: nexus-kafdrop
    environment:
      KAFKA_BROKERCONNECT: nexus-kafka:9092
      JVM_OPTS: "-Xms64M -Xmx128M"
    ports:
      - "9004:9000"
    networks:
      - nexus-network
    depends_on:
      nexus-kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── Kafka Connect (Debezium) ──────────────────────────────────
  # NOTE: Host port is 18083 (NOT 8083) to avoid conflict with
  #       nexus-identity-service which also uses host port 8083.
  nexus-kafka-connect:
    image: debezium/connect:2.6
    container_name: nexus-kafka-connect
    depends_on:
      nexus-kafka:
        condition: service_healthy
      nexus-postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: nexus-kafka:9092
      GROUP_ID: nexus-debezium-connect
      CONFIG_STORAGE_TOPIC: nexus.connect.configs
      OFFSET_STORAGE_TOPIC: nexus.connect.offsets
      STATUS_STORAGE_TOPIC: nexus.connect.status
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
    ports:
      - "18083:8083"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # ── Debezium Init (registers connectors once on first run) ────
  nexus-debezium-init:
    image: curlimages/curl:8.6.0
    container_name: nexus-debezium-init
    depends_on:
      nexus-kafka-connect:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - ./debezium:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/register.sh"]
    restart: "no"
    networks:
      - nexus-network

  # ── Kafka Topics Init ─────────────────────────────────────────
  # Runs once after Kafka is healthy; pre-creates all platform topics
  # so Kafka Streams consumers don't throw MissingSourceTopicException.
  nexus-kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexus-kafka-topics-init
    depends_on:
      nexus-kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic transactions.initiated       --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic transactions.completed       --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic transactions.failed          --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic fraud.flagged               --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic fraud.result                --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic accounts.created            --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic identity.verified           --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic identity.rejected           --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic users.registered            --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic saga.commands               --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic saga.replies                --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic ledger.posted               --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic analytics.anomalies.detected --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server nexus-kafka:9092 --create --if-not-exists --topic ai.query.logged             --partitions 3 --replication-factor 1
      "
    networks:
      - nexus-network
    restart: "no"

  # ── Ollama (local LLM fallback) — disabled by default ─────────
  # Uncomment to enable Ollama as fallback for ai-assistant-service.
  # Warning: pulls ~3.2GB on first start.
  # nexus-ollama:
  #   image: ollama/ollama:latest
  #   container_name: nexus-ollama
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - nexus-network
  #   restart: unless-stopped

  # ================================================================
  # PLATFORM SERVICES
  # ================================================================
  # Start groups in order:
  #   core → auth → txn → ai → support → gateway
  # Each step waits for depends_on health checks automatically.
  # On failure: restart: on-failure retries with Docker's backoff.
  # ================================================================

  # ── Config Service ─────────────────────── profile: core ──────
  nexus-config-service:
    build:
      context: ./nexus-config-service
      dockerfile: Dockerfile
    container_name: nexus-config-service
    image: nexus/config-service:latest
    profiles: [core]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      GIT_TOKEN: ${GIT_TOKEN:?required}
      GIT_USERNAME: ${GIT_USERNAME:-Solano204}
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-nexus-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?required}
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: nexus-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPRING_DATA_REDIS_TIMEOUT: 5s
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 5s
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?required}
      MANAGEMENT_HEALTH_CONFIG_ENABLED: "false"
    ports:
      - "8888:8888"
    networks:
      - nexus-network
    depends_on:
      nexus-kafka:
        condition: service_healthy
      nexus-zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: on-failure

  # ── Discovery Service ──────────────────── profile: core ──────
  nexus-discovery-service:
    build:
      context: .
      dockerfile: nexus-discovery-service/Dockerfile
    container_name: nexus-discovery-service
    image: nexus/discovery-service:latest
    profiles: [core]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URI: http://nexus-config-service:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-nexus-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?required}
    ports:
      - "8761:8761"
    networks:
      - nexus-network
    depends_on:
      nexus-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: on-failure

  # ── Identity Service ───────────────────── profile: auth ──────
  nexus-identity-service:
    build:
      context: ./nexus-identity-service
      dockerfile: Dockerfile
    container_name: nexus-identity-service
    image: nexus/identity-service:latest
    profiles: [auth]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      CONFIG_SERVER_URI: http://nexus-config-service:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-nexus-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?required}
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_identity
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REDIS_HOST: nexus-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: nexus-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPRING_DATA_REDIS_TIMEOUT: 5s
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 5s
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      JWT_KEYSTORE_PATH: /secrets/nexus-identity.jks
      JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD:?required}
      # AWS — real S3 bucket for KYC documents + real SQS queue
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?required}
      KYC_S3_BUCKET: ${KYC_S3_BUCKET:-nexus-kyc-documents}
      KYC_SQS_QUEUE_URL: ${KYC_SQS_QUEUE_URL:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8083:8083"
    networks:
      - nexus-network
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-kafka:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: on-failure

  # ── Account Service ────────────────────── profile: txn ───────
  nexus-account-service:
    build:
      context: ./nexus-account-service
      dockerfile: Dockerfile
    container_name: nexus-account-service
    image: nexus/account-service:latest
    profiles: [txn]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URI: http://nexus-config-service:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-nexus-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?required}
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_accounts
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      MONGO_USER: nexus
      MONGO_PASSWORD: ${MONGO_PASSWORD:?required}
      MONGO_HOST: nexus-mongodb
      MONGODB_URI: mongodb://nexus:${MONGO_PASSWORD:?required}@nexus-mongodb:27017/nexus_accounts?authSource=admin
      REDIS_HOST: nexus-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: nexus-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPRING_DATA_REDIS_TIMEOUT: 5s
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 5s
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
    ports:
      - "8085:8085"
    networks:
      - nexus-network
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-mongodb:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
