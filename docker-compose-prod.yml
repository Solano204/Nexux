      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 5s
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
    ports:
      - "18094:8094"
    networks:
      - nexus-backend
      - nexus-data
    secrets:
      - config_server_password
      - postgres_password
      - redis_password
      - openai_api_key
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
      nexus-kafka:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8094/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: "no"

  # ── Audit Query JVM ────────────────────── profile: support ───
  nexus-audit-query-jvm:
    build:
      context: ./nexus-audit-query-jvm
      dockerfile: Dockerfile
    container_name: nexus-audit-query-jvm
    logging: *default-logging
    security_opt: *no-new-privileges
    image: nexus/audit-query-jvm:latest
    mem_limit: 1792m
    cpus: 0.75
    profiles: [support]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URI: http://nexus-config-service:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-nexus-config}
      CONFIG_SERVER_PASSWORD_FILE: /run/secrets/config_server_password
      DATASOURCE_URL: jdbc:postgresql://nexus-postgres:5432/nexus_audit
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # application-prod.yml reads: spring.elasticsearch.uris: ${ELASTICSEARCH_URIS}
      ELASTICSEARCH_URIS: http://nexus-elasticsearch:9200
      MONGO_USER: nexus
      MONGO_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_HOST: nexus-mongodb
      # MONGODB_URI assembled by docker-entrypoint.sh from MONGO_DB + MONGO_HOST
      # + MONGO_PASSWORD_FILE (see account-service for the full rationale).
      MONGO_DB: nexus_audit
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
    ports:
      - "8097:8097"
    networks:
      - nexus-backend
      - nexus-data
    secrets:
      - config_server_password
      - postgres_password
      - mongo_password
      - openai_api_key
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-elasticsearch:
        condition: service_healthy
      nexus-mongodb:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8097/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: "no"

  # ── Audit Write Native (Quarkus) ───────── profile: support ───
  nexus-audit-write-native:
    build:
      context: ./audit-write-native
      dockerfile: Dockerfile.native
    container_name: nexus-audit-write-native
    logging: *default-logging
    security_opt: *no-new-privileges
    image: nexus/audit-write-native:latest
    mem_limit: 512m
    cpus: 0.5
    profiles: [support]
    environment:
      QUARKUS_PROFILE: prod
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      # application.properties %prod.elasticsearch.hosts: ${ELASTICSEARCH_HOSTS}
      ELASTICSEARCH_HOSTS: http://nexus-elasticsearch:9200
      MONGO_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_HOST: nexus-mongodb
      # MONGODB_URI assembled by docker-entrypoint.sh from MONGO_DB + MONGO_HOST
      # + MONGO_PASSWORD_FILE (see account-service for the full rationale).
      MONGO_DB: nexus_audit
      # application.properties %prod.quarkus.redis.hosts: ${REDIS_URL}
      REDIS_URL: redis://nexus-redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SPRING_DATA_REDIS_HOST: nexus-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SPRING_DATA_REDIS_TIMEOUT: 5s
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 5s
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: "0.05"
    ports:
      - "8096:8096"
    networks:
      - nexus-backend
      - nexus-data
    secrets:
      - mongo_password
      - redis_password
    depends_on:
      nexus-kafka:
        condition: service_healthy
      nexus-elasticsearch:
        condition: service_healthy
      nexus-mongodb:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8096/q/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: "no"

  # ── API Gateway ────────────────────────── profile: gateway ───
  nexus-api-gateway:
    build:
      context: ./nexus-api-gateway
      dockerfile: Dockerfile
    container_name: nexus-api-gateway
    logging: *default-logging
    security_opt: *no-new-privileges
    image: nexus/api-gateway:latest
    mem_limit: 2560m
    cpus: 1.5
    profiles: [gateway]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URI: http://nexus-config-service:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-nexus-config}
      CONFIG_SERVER_PASSWORD_FILE: /run/secrets/config_server_password
      REDIS_HOST: nexus-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SPRING_DATA_REDIS_HOST: nexus-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SPRING_DATA_REDIS_TIMEOUT: 5s
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 5s
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT: 2000ms
      KAFKA_BOOTSTRAP_SERVERS: nexus-kafka:9092
      EUREKA_DEFAULT_ZONE: http://nexus-discovery-service:8761/eureka/
      ZIPKIN_ENDPOINT: http://nexus-zipkin:9411/api/v2/spans
      # JWKS endpoint: gateway validates JWT using identity service public key
      JWT_JWKS_URI: http://nexus-identity-service:8083/api/v1/auth/.well-known/jwks.json
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_REGION: ${AWS_REGION:-us-east-1}
      # Allow localhost for dev/testing in addition to production domain
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200,https://app.nexusbank.com}
      # Sampling rate now lives centrally in nexus-platform-config
      # (management.tracing.sampling.probability) - not overridden per-service.
    ports:
      - "8080:8080"
    networks:
      - nexus-frontend
      - nexus-backend
      - nexus-data
    secrets:
      - config_server_password
      - redis_password
    depends_on:
      nexus-redis:
        condition: service_healthy
      nexus-kafka:
        condition: service_healthy
      nexus-config-service:
        condition: service_healthy
      nexus-discovery-service:
        condition: service_healthy
      nexus-identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: "no"
