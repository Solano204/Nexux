# ══════════════════════════════════════════════════════════════
# nexus-ledger-service — DEV profile
# Active when: SPRING_PROFILES_ACTIVE=dev
#
# Prerequisites:
#   docker compose up -d nexus-postgres nexus-mongodb nexus-kafka \
#     nexus-config-service nexus-discovery-service
# ══════════════════════════════════════════════════════════════

spring:
  cloud:
    config:
      enabled: false
      fail-fast: false
    bus:
      enabled: false

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_ledger
    username: nexus
    password: nexus_dev_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        lock_timeout: 30000         # More lenient in dev
        application_name: nexus-ledger-service-dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration   # NOTE: actual files are in db.migration/ — see BUGS.md
    baseline-on-migrate: true

  data:
    mongodb:
      uri: mongodb://nexus:nexus_dev_password@localhost:27017/nexus_ledger?authSource=admin

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledger-service-saga-commands-dev

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: financial_literacy_embeddings

server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.nexus.ledger: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.ai: DEBUG
