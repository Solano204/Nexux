spring:
  cloud:
    config:
      enabled: false

  threads:
    virtual:
      # disabled: breaks Brave trace-context propagation - see application.yml
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus_ledger
    username: nexus
    password: nexus_dev_password
    hikari:
      auto-commit: false
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        lock_timeout: 30000
        application_name: nexus-ledger-service-dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false   # ← cambiar a false

  data:
    mongodb:
      uri: mongodb://localhost:27018/nexus_ledger

  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: ledger-service-saga-commands-dev

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: financial_literacy_embeddings

server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9412/api/v2/spans

logging:
  level:
    com.nexus.ledger: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.ai: DEBUG
